site_name: Avalon Server
site_description: Official server-side solution for the Avalon ARPG
site_url: https://woozchucky.github.io/Avalon.Server
repo_url: https://github.com/WoozChucky/Avalon.Server
repo_name: WoozChucky/Avalon.Server
edit_uri: edit/main/docs/

theme:
  name: material
  # Holds api-reference.html, a full-page template for the generated API reference.
  custom_dir: overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ['.']
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
    - Development Setup: development-setup.md
    - Configuration: configuration-reference.md
    - Contributing: contributing.md
  - Architecture:
    - Overview: architecture-startup-flow.md
    - Decisions: architecture-decisions.md
    - DbContext Lifetime: dbcontext-lifetime.md
    - Value Objects & OpenAPI: valueobject-openapi.md
    - GC Pressure: gc-pressure.md
  - Networking:
    - Packet Protocol: networking-packet-protocol.md
    - Packet Handlers: packet-handlers.md
    - Proto Schema Design: networking-proto-schema-design.md
    - Session Crypto: crypto-v1-derivation.md
    - Crypto Security Review: security-review-network-crypto.md
    - Graceful Shutdown: networking-graceful-shutdown.md
  - Auth and Accounts:
    - Auth Server: auth-server.md
    - Security & Sessions: security-session-management.md
    - Redis Cache Keys: redis-cache-keys.md
    - Steam Authentication: steam-authentication.md
    - Steam Workloads: steam-authentication-workloads.md
    - Steam Account Links: steam-account-links.md
  - REST API:
    - API Reference: api-reference.md
    - Authentication: api-authentication.md
    - Multi-world API: api-worlds.md
    - Live Template Editing: live-template-editing.md
    - Commerce: commerce-configuration.md
  - World:
    - World Simulation: world-simulation.md
    - Instanced Maps: instanced-maps.md
    - Map Generation: map-generation.md
    - Creature System: creature-system.md
    - Spell System: spell-system.md
    - Character Login Flow: character-login-flow.md
    - Character Readiness Barrier: character-readiness-barrier.md
  - Gameplay:
