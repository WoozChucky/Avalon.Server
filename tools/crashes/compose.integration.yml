# All state belongs to the generated Compose project. No published ports or external volumes.
services:
  postgres:
    image: postgres:18@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
    command: [postgres, -p, "5433"]
    env_file: ${CRASHES_RUN_DIR:?}/postgres.env
    volumes: [postgres:/var/lib/postgresql]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -p 5433"]
      interval: 1s
      timeout: 3s
      retries: 60
  garage:
    image: dxflrs/garage:v2.5.0@sha256:677e5b758e4425a325b811c425c026bf35a4bf42f7ddbaa773de3f4fd779a5a5
    volumes:
      - ${CRASHES_RUN_DIR:?}/garage.toml:/etc/garage.toml:ro
      - garage:/var/lib/garage
  garage-tls:
    image: nginx:alpine@sha256:a3554c0d0b48177b1413c26e01f695334428020d9df01243fbae3e11cfd17417
    volumes:
      - ${CRASHES_RUN_DIR:?}/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${CRASHES_RUN_DIR:?}/tls:/tls:ro
    depends_on: [garage]
  collector:
    image: otel/opentelemetry-collector-contrib:0.163.2@sha256:7f22d2a6748110ffb6a59bc0df448bccbf501cdb667d610ede4c61d3863d5849
    user: "0:0"
    command: ["--config=/etc/collector.yaml"]
    volumes:
      - ${CRASHES_RUN_DIR:?}/collector.yaml:/etc/collector.yaml:ro
      - capture:/capture
volumes:
  capture: {}
  postgres: {}
  garage: {}
networks:
  default:
    internal: true
