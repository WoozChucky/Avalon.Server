apiVersion: v1
kind: Service
metadata:
  name: {{ include "avalon-crashes.fullname" . }}
spec:
  type: ClusterIP
  selector:
    {{- include "avalon-crashes.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: worker
  ports:
    - name: health
      port: 8080
      targetPort: health
