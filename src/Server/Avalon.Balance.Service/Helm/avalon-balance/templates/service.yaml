apiVersion: v1
kind: Service
metadata:
  name: {{ include "avalon-balance.fullname" . }}
  labels:
    {{- include "avalon-balance.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "avalon-balance.selectorLabels" . | nindent 4 }}
