{{- /*
Every secret the service reads, kept out of the pod spec: the Deployment references these keys with
secretKeyRef. Skipped when existingSecret names a Secret you manage, which must hold balance-shared-secret
and may hold github-token. With existingSecret, inline values are refused rather than ignored. The shared
secret is required and at least 32 characters (the service refuses to start otherwise).
*/}}
{{- if not .Values.existingSecret }}
{{- $shared := .Values.sharedSecret | default "" | toString | trim }}
{{- $token := .Values.githubToken | default "" | toString | trim }}
{{- if lt (len $shared) 32 }}
{{- fail "sharedSecret is required unless existingSecret is set: at least 32 characters. Pass it with --set-file sharedSecret=<file>, or name a Secret you manage with existingSecret." }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "avalon-balance.secretName" . }}
  labels:
    {{- include "avalon-balance.labels" . | nindent 4 }}
type: Opaque
stringData:
  balance-shared-secret: {{ $shared | quote }}
  {{- if $token }}
  github-token: {{ $token | quote }}
  {{- end }}
{{- else }}
{{- $given := list }}
{{- if .Values.sharedSecret }}{{ $given = append $given "sharedSecret" }}{{ end }}
{{- if .Values.githubToken }}{{ $given = append $given "githubToken" }}{{ end }}
{{- if $given }}
{{- fail (printf "existingSecret is set to %q, so the chart reads every secret from it and would ignore %s. Put those values in the Secret and unset them here, or unset existingSecret." .Values.existingSecret (join ", " $given)) }}
{{- end }}
{{- end }}
