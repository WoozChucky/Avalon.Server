# Name of a Secret you manage holding database-auth-connection-string, cache-password,
# tls.pfx and tls-password. When empty, the chart renders one from server.* below.
existingSecret: ""

# ASP.NET Core / generic host environment.
environment: Production

server:
  hosting:
    host: "0.0.0.0"
  cache:
    # Required: host:port of Redis.
    host: ""
    # Secret: ignored (and refused) when existingSecret is set.
    password: ""
  database:
    auth:
      # Secret: ignored (and refused) when existingSecret is set.
      connectionString: ""
  tls:
    # Secret: base64 of the PKCS#12 certificate. Required unless existingSecret is set.
    pfx: ""
    password: ""

replicaCount: 1

image:
  repository: ghcr.io/woozchucky/avalon-server/auth
  pullPolicy: IfNotPresent
  # Empty means the chart's appVersion, which the release sets to the git tag.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
podAnnotations: {}
podSecurityContext: {}
securityContext: {}

service:
  # LoadBalancer on k3s binds the port on the node (ServiceLB).
  type: ClusterIP
  port: 21000

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 1Gi
