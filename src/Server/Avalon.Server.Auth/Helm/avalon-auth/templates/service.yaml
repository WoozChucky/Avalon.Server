apiVersion: v1
kind: Service
metadata:
  name: {{ include "avalon-server.fullname" . }}
  labels:
    {{- include "avalon-server.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  {{- with .Values.service.loadBalancerSourceRanges }}
  # Only these sources may reach a LoadBalancer Service (e.g. just the fronting proxy).
  loadBalancerSourceRanges:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: server-tcp
      protocol: TCP
      name: server-tcp
  selector:
    {{- include "avalon-server.selectorLabels" . | nindent 4 }}
