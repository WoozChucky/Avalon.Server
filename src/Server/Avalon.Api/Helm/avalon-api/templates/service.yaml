{{- $services := include "avalon-api.services" . | fromJsonArray }}
{{- if $services }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "avalon-api.fullname" . }}
  labels:
    {{- include "avalon-api.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    {{- if has "identity" $services }}
    - port: {{ .Values.gameAdmission.port }}
      targetPort: game-internal
      protocol: TCP
      name: game-internal
    {{- end }}
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "avalon-api.selectorLabels" . | nindent 4 }}
{{- end }}
