{{- /*
The API process (#794): the services listed in services, or all four when it is left out. Each
service's values reach the pod only when it is listed (design D9.2), so a pod reads only the
settings and Secret keys of its own services. A routes release renders no pod.
*/}}
{{- $services := include "avalon-api.services" . | fromJsonArray }}
{{- if $services }}
{{- $identity := has "identity" $services }}
{{- $worlds := has "worlds" $services }}
{{- $commerce := has "commerce" $services }}
{{- $distribution := has "distribution" $services }}
{{- $cache := or $identity $worlds $commerce }}
{{- $parts := include "avalon-api.worldParts" $services | fromJsonArray }}
{{- include "avalon-api.refuseSecretValues" . }}
{{- include "avalon-api.validateSigning" (list . $identity) }}
{{- include "avalon-api.validateWorlds" (list . $parts) }}
{{- if $identity }}
{{- include "avalon-api.validateEmail" . }}
{{- end }}
{{- if $commerce }}
{{- include "avalon-api.validateCommerce" . }}
{{- end }}
{{- if $cache }}
{{- include "avalon-api.validateCache" . }}
{{- end }}
{{- $cacheKey := include "avalon-api.cachePasswordKey" . }}
{{- $steamAppId := 0 }}
{{- if $identity }}
{{- $configuredSteamAppId := required "storeAuthentication.steamAppId is required" .Values.storeAuthentication.steamAppId }}
{{- $steamAppId = int64 $configuredSteamAppId }}
{{- /* Emit canonical decimal, even when YAML decodes a large App ID as float64; never truncate a fraction. */}}
{{- if or (le $steamAppId 0) (gt $steamAppId 4294967295) (ne (float64 $configuredSteamAppId) (float64 $steamAppId)) }}
{{- fail "storeAuthentication.steamAppId is required and must be a positive 32-bit integer" }}
{{- end }}
{{- include "avalon-api.validateSteamPlaytest" . }}
{{- end }}
{{- $playtest := .Values.storeAuthentication.steamPlaytest | default dict }}
{{- /* Without identity the process reads the auth schema identity migrates, and waits for it at startup (#794, design D5.2). */}}
{{- $schemaWait := (.Values.startup | default dict).authSchemaWaitSeconds | toString }}
{{- if and (not $identity) (not (regexMatch "^[1-9][0-9]{0,6}$" $schemaWait)) }}
{{- fail "startup.authSchemaWaitSeconds is a whole number of seconds, at least 1: how long a process without identity waits for identity's auth database migrations." }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "avalon-api.fullname" . }}
  labels:
    {{- include "avalon-api.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "avalon-api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- if not .Values.existingSecret }}
        # Rolls the pods when a chart-managed secret changes, so a rotated signing key takes effect.
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "avalon-api.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            {{- /* Only when services lists them: left out, the process runs every service (#794). */}}
            {{- range $i, $service := .Values.services }}
            - name: Application__Services__{{ $i }}
              value: {{ $service | toString | trim | lower | quote }}
            {{- end }}
            {{- if not $identity }}
            - name: Application__Startup__AuthSchemaWaitSeconds
              value: {{ $schemaWait | quote }}
            {{- end }}
            {{- if $commerce }}
            - name: Application__Commerce__Enabled
              value: {{ .Values.commerce.enabled | quote }}
            - name: Application__Commerce__AllowExistingAccountSandbox
              value: {{ .Values.commerce.allowExistingAccountSandbox | quote }}
            {{- if .Values.commerce.enabled }}
            {{- range $name, $value := dict "Provider" .Values.commerce.provider "PaymentEnvironment" .Values.commerce.paymentEnvironment "LicenseEnvironment" .Values.commerce.licenseEnvironment "AmountMinor" .Values.commerce.amountMinor "Currency" .Values.commerce.currency "Quantity" .Values.commerce.quantity "Product" .Values.commerce.product "ProviderProduct" .Values.commerce.providerProduct "PublicSiteOrigin" .Values.commerce.publicSiteOrigin "OfferId" .Values.commerce.offerId "ProviderPriceId" .Values.commerce.providerPriceId "ProviderCatalogProductId" .Values.commerce.providerCatalogProductId "ProviderAccountId" .Values.commerce.providerAccountId }}
            - name: Application__Commerce__{{ $name }}
              value: {{ $value | quote }}
            {{- end }}
            {{- range $i, $method := .Values.commerce.paymentMethods }}
            - name: Application__Commerce__PaymentMethods__{{ $i }}
              value: {{ $method | quote }}
            {{- end }}
            - name: Application__Commerce__ApiKey
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.commerce.existingSecret | quote }}
                  key: {{ .Values.commerce.apiKeyKey | quote }}
            - name: Application__Commerce__WebhookSecret
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.commerce.existingSecret | quote }}
                  key: {{ .Values.commerce.webhookSecretKey | quote }}
            {{- end }}
            {{- end }}
            {{- if $identity }}
            - name: Application__StoreAuthentication__SteamAppId
              value: {{ $steamAppId | quote }}
            - name: Application__StoreAuthentication__SteamPlaytest__Enabled
              value: {{ $playtest.enabled | default false | quote }}
            - name: Application__StoreAuthentication__SteamPlaytest__AppId
              value: {{ $playtest.appId | default 0 | int64 | quote }}
            {{- range $i, $world := $playtest.allowedWorldIds }}
            - name: Application__StoreAuthentication__SteamPlaytest__AllowedWorldIds__{{ $i }}
              value: {{ $world | int64 | quote }}
            {{- end }}
            - name: Application__StoreAuthentication__SteamPublisherKey
              valueFrom:
                secretKeyRef:
                  name: {{ required "storeAuthentication.existingSecret is required" .Values.storeAuthentication.existingSecret | quote }}
                  key: {{ required "storeAuthentication.publisherKeyKey is required" .Values.storeAuthentication.publisherKeyKey | quote }}
            {{- end }}
            {{- if or $identity $commerce }}
            - name: Application__StoreAuthentication__Environment
              value: {{ .Values.storeAuthentication.environment | quote }}
            - name: Application__StoreAuthentication__SteamIdentityPrefix
              value: {{ .Values.storeAuthentication.steamIdentityPrefix | quote }}
            {{- end }}
            {{- if $identity }}
            - name: Application__StoreAuthentication__PolicyVersion
              value: {{ .Values.storeAuthentication.policyVersion | quote }}
            {{- end }}
            - name: Kestrel__Endpoints__Public__Url
              value: {{ printf "http://0.0.0.0:%v" .Values.service.port | quote }}
            {{- if $identity }}
            - name: Application__Email__Sender
              value: {{ .Values.email.sender | quote }}
            - name: Application__Email__VerificationCooldownSeconds
              value: {{ .Values.email.verificationCooldownSeconds | quote }}
            - name: Application__Email__MaxVerificationSendsPerAccount
              value: {{ .Values.email.maxVerificationSendsPerAccount | quote }}
            - name: Application__Email__MaxVerificationSendsPerSource
              value: {{ .Values.email.maxVerificationSendsPerSource | quote }}
            {{- with .Values.email.from }}
            - name: Application__Email__From
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.email.fromName }}
            - name: Application__Email__FromName
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.email.verificationSiteOrigin }}
            - name: Application__Email__VerificationSiteOrigin
              value: {{ . | quote }}
            {{- end }}
            {{- if eq .Values.email.sender "Resend" }}
            - name: Application__Email__ResendApiKey
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.email.existingSecret | quote }}
                  key: {{ .Values.email.resendApiKeyKey | quote }}
            {{- end }}
            {{- /* Kestrel binds every endpoint under Kestrel:Endpoints, so the workload listener exists only with identity (#794). */}}
            - name: Kestrel__Endpoints__GameInternal__Url
              value: {{ printf "https://0.0.0.0:%v" .Values.gameAdmission.port | quote }}
            - name: Kestrel__Endpoints__GameInternal__Certificate__Path
              value: /run/avalon-auth/api-workload.pfx
            - name: Kestrel__Endpoints__GameInternal__Certificate__Password
              valueFrom:
                secretKeyRef:
                  name: {{ required "gameAdmission.tlsExistingSecret is required" .Values.gameAdmission.tlsExistingSecret | quote }}
                  key: tls-password
                  optional: true
            {{- if not .Values.gameAdmission.servers }}
            {{- fail "gameAdmission.servers is required: bind each world to its TLS/workload certificates" }}
            {{- end }}
            {{- range $i, $server := .Values.gameAdmission.servers }}
            - name: Application__GameWorkloads__Servers__{{ $i }}__ServerId
              value: {{ required "gameAdmission serverId is required" $server.serverId | quote }}
            - name: Application__GameWorkloads__Servers__{{ $i }}__WorldId
              value: {{ required "gameAdmission worldId is required" $server.worldId | quote }}
            - name: Application__GameWorkloads__Servers__{{ $i }}__TlsServerName
              value: {{ required "gameAdmission tlsServerName is required" $server.tlsServerName | quote }}
            - name: Application__GameWorkloads__Servers__{{ $i }}__TlsCertificateSha256
              valueFrom:
                secretKeyRef:
                  name: {{ required "gameAdmission.bindingsExistingSecret is required" $.Values.gameAdmission.bindingsExistingSecret | quote }}
                  key: {{ printf "%s-tls-sha256" $server.serverId | quote }}
            - name: Application__GameWorkloads__Servers__{{ $i }}__ClientCertificateSha256
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.gameAdmission.bindingsExistingSecret | quote }}
                  key: {{ printf "%s-client-sha256" $server.serverId | quote }}
            {{- end }}
            {{- end }}
            # Secrets come from the Secret (templates/secret.yaml or existingSecret), never as
            # plain values in the pod spec (#482).
            - name: Database__Auth__ConnectionString
              valueFrom:
                secretKeyRef:
                  name: {{ include "avalon-api.secretName" . }}
                  key: database-auth-connection-string
            {{- if $parts }}
            {{- range $id, $entry := .Values.worlds }}
            # World {{ $id }} (Database:Worlds, #523).
            {{- if has "world" $parts }}
            - name: Database__Worlds__{{ $id }}__World__ConnectionString
              valueFrom:
                secretKeyRef:
                  name: {{ include "avalon-api.secretName" $ }}
                  key: {{ include "avalon-api.worldKey" (list $id $entry) | quote }}
            {{- end }}
            - name: Database__Worlds__{{ $id }}__Characters__ConnectionString
              valueFrom:
                secretKeyRef:
                  name: {{ include "avalon-api.secretName" $ }}
                  key: {{ include "avalon-api.charactersKey" (list $id $entry) | quote }}
            {{- end }}
            {{- end }}
            {{- if $cache }}
            - name: Application__Cache__Password
              valueFrom:
                secretKeyRef:
                  name: {{ include "avalon-api.secretName" . }}
                  {{- if eq $cacheKey "cache-password" }}
                  key: cache-password
                  optional: true
                  {{- else }}
                  key: {{ $cacheKey | quote }}
                  {{- end }}
            {{- end }}
            {{- if $identity }}
            - name: Application__Notification__PrivateKey
              valueFrom:
                secretKeyRef:
                  name: {{ include "avalon-api.secretName" . }}
                  key: notification-private-key
                  optional: true
            {{- end }}
            {{- if $worlds }}
            - name: Application__Balance__SharedSecret
              valueFrom:
                secretKeyRef:
                  name: {{ include "avalon-api.secretName" . }}
                  key: balance-shared-secret
                  optional: true
            {{- with .Values.balance.url }}
            - name: Application__Balance__Url
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- if $distribution }}
            {{- with .Values.distribution.endpoint }}
            - name: Application__Distribution__Endpoint
              value: {{ . | quote }}
            - name: Application__Distribution__PublicUrl
              value: {{ $.Values.distribution.publicUrl | quote }}
            - name: Application__Distribution__Bucket
              value: {{ $.Values.distribution.bucket | quote }}
            - name: Application__Distribution__Region
              value: {{ $.Values.distribution.region | quote }}
            - name: Application__Distribution__AccessKeyId
              value: {{ $.Values.distribution.accessKeyId | quote }}
            - name: Application__Distribution__SecretAccessKey
              valueFrom:
                secretKeyRef:
                  name: {{ include "avalon-api.secretName" $ }}
                  key: distribution-secret-key
            {{- end }}
            {{- end }}
            {{- /* Access tokens are ES256 only (#801): only identity holds the private key and the game-auth host key, both required; every service checks tokens with the public keys. */}}
            {{- if $identity }}
            - name: Application__Authentication__SigningKey
              valueFrom:
                secretKeyRef:
                  name: {{ include "avalon-api.secretName" . }}
                  key: jwt-signing-private-key
            - name: Application__Authentication__SigningKeyId
              value: {{ .Values.authentication.signingKeyId | toString | quote }}
            - name: Application__GameAuth__HostKey
              valueFrom:
                secretKeyRef:
                  name: {{ include "avalon-api.secretName" . }}
                  key: game-auth-host-key
            {{- end }}
            {{- range $kid, $key := .Values.authentication.validationKeys }}
            - name: Application__Authentication__ValidationKeys__{{ $kid }}
              value: {{ $key | toString | trim | quote }}
            {{- end }}
            # Not secret.
            {{- if $cache }}
            - name: Application__Cache__Host
              value: {{ required "cache.host is required: host:port of Redis" .Values.cache.host | quote }}
            {{- with .Values.cache.username }}
            - name: Application__Cache__Username
              value: {{ . | toString | quote }}
            {{- end }}
            {{- end }}
            {{- if $identity }}
            - name: Application__Notification__Subject
              value: {{ .Values.notification.subject | quote }}
            - name: Application__Notification__PublicKey
              value: {{ .Values.notification.publicKey | quote }}
            {{- end }}
            {{- range $i, $proxy := .Values.forwardedHeaders.knownProxies }}
            - name: Application__ForwardedHeaders__KnownProxies__{{ $i }}
              value: {{ $proxy | quote }}
            {{- end }}
            {{- range $i, $network := .Values.forwardedHeaders.knownNetworks }}
            - name: Application__ForwardedHeaders__KnownNetworks__{{ $i }}
              value: {{ $network | quote }}
            {{- end }}
            - name: Application__ForwardedHeaders__ForwardLimit
              value: {{ .Values.forwardedHeaders.forwardLimit | quote }}
            {{- /* Each only when set, so the API's own default applies otherwise; false and 0 are set values (#561). */}}
            {{- $rateLimiting := .Values.rateLimiting | default dict }}
            {{- if not (kindIs "invalid" $rateLimiting.enabled) }}
            - name: Application__RateLimiting__Enabled
              value: {{ $rateLimiting.enabled | quote }}
            {{- end }}
            {{- if not (kindIs "invalid" $rateLimiting.anonymousPermitsPerMinute) }}
            - name: Application__RateLimiting__AnonymousPermitsPerMinute
              value: {{ $rateLimiting.anonymousPermitsPerMinute | quote }}
            {{- end }}
            {{- if not (kindIs "invalid" $rateLimiting.authenticatedPermitsPerMinute) }}
            - name: Application__RateLimiting__AuthenticatedPermitsPerMinute
              value: {{ $rateLimiting.authenticatedPermitsPerMinute | quote }}
            {{- end }}
            {{- if and $identity (not (kindIs "invalid" $rateLimiting.clientAuthPermitsPerMinute)) }}
            - name: Application__RateLimiting__ClientAuthPermitsPerMinute
              value: {{ $rateLimiting.clientAuthPermitsPerMinute | quote }}
            {{- end }}
            {{- range $i, $source := $rateLimiting.exemptSources }}
            - name: {{ printf "Application__RateLimiting__ExemptSources__%d" $i }}
              value: {{ $source | toString | quote }}
            {{- end }}
            {{- /* Identity's alone, each only when set, so the API's defaults (off, 5000) apply otherwise. */}}
            {{- $loadTest := .Values.loadTest | default dict }}
            {{- if and $identity (not (kindIs "invalid" $loadTest.enabled)) }}
            - name: Application__LoadTest__Enabled
              value: {{ $loadTest.enabled | toString | quote }}
            {{- end }}
            {{- if and $identity (not (kindIs "invalid" $loadTest.maxAccounts)) }}
            {{- $maxAccounts := $loadTest.maxAccounts | toString }}
            {{- /* Helm reads a values-file number as a float, which prints a large one as 1e+06: a whole one as digits. */}}
            {{- if and (kindIs "float64" $loadTest.maxAccounts) (eq ($loadTest.maxAccounts | int64 | float64) $loadTest.maxAccounts) }}
            {{- $maxAccounts = $loadTest.maxAccounts | int64 | toString }}
            {{- end }}
            {{- if not (regexMatch "^[1-9][0-9]{0,8}$" $maxAccounts) }}
            {{- fail "loadTest.maxAccounts is a whole number, at least 1: how many load-test accounts may exist at once." }}
            {{- end }}
            - name: Application__LoadTest__MaxAccounts
              value: {{ $maxAccounts | quote }}
            {{- end }}
            {{- if $worlds }}
            {{- range $i, $id := .Values.templates.editableWorlds }}
            - name: {{ printf "Application__Templates__EditableWorlds__%d" $i }}
              value: {{ $id | toString | quote }}
            {{- end }}
            {{- with .Values.templates.reloadTimeout }}
            - name: Application__Templates__ReloadTimeout
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- if $identity }}
            {{- $steamWebLink := .Values.steamWebLink | default dict }}
            {{- with $steamWebLink.callbackUrl }}
            - name: Application__SteamWebLink__CallbackUrl
              value: {{ . | quote }}
            {{- end }}
            {{- with $steamWebLink.siteUrl }}
            - name: Application__SteamWebLink__SiteUrl
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- if $worlds }}
            {{- with .Values.publicSiteUrl }}
            - name: Application__PublicSiteUrl
              value: {{ . | quote }}
            {{- end }}
            {{- if not (kindIs "invalid" .Values.publicWorldId) }}
            - name: Application__PublicWorldId
              value: {{ .Values.publicWorldId | quote }}
            {{- end }}
            {{- end }}
            - name: DOTNET_HOSTBUILDER__RELOADCONFIGONCHANGE
              value: "false"
            {{- with .Values.otel.endpoint }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ . | quote }}
            - name: OTEL_SERVICE_NAME
              value: {{ $.Values.otel.serviceName | default (include "avalon-api.fullname" $) | quote }}
            {{- $attrs := list }}
            {{- range $key, $value := $.Values.otel.resourceAttributes }}
            {{- $attrs = append $attrs (printf "%s=%v" $key $value) }}
            {{- end }}
            {{- with $attrs }}
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: {{ join "," . | quote }}
            {{- end }}
            {{- end }}
            - name: ASPNETCORE_ENVIRONMENT
              value: {{ .Values.environment | quote }}
            {{- if $worlds }}
            - name: Application__MapAssets__ChunkAssetRoot
              value: {{ .Values.mapAssets.chunkAssetRoot | quote }}
            {{- end }}
          {{- if $identity }}
          volumeMounts:
            - name: api-admission-credentials
              mountPath: /run/avalon-auth
              readOnly: true
          {{- end }}
          ports:
            {{- if $identity }}
            - name: game-internal
              containerPort: {{ .Values.gameAdmission.port }}
              protocol: TCP
            {{- end }}
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          {{- if not $identity }}
          # Allows the wait for identity's migrations (startup.authSchemaWaitSeconds) and a minute more,
          # before the liveness probe takes over.
          startupProbe:
            httpGet:
              path: /alive
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: {{ add (div (add (atoi $schemaWait) 4) 5) 12 }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /alive
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- if $identity }}
      volumes:
        - name: api-admission-credentials
          secret:
            secretName: {{ .Values.gameAdmission.tlsExistingSecret | quote }}
            items:
              - key: tls.pfx
                path: api-workload.pfx
      {{- end }}
{{- end }}
