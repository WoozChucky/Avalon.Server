{{- include "avalon-api.validateWorlds" . }}
{{- $configuredSteamAppId := required "storeAuthentication.steamAppId is required" .Values.storeAuthentication.steamAppId }}
{{- $steamAppId := int64 $configuredSteamAppId }}
{{- /* Emit canonical decimal, even when YAML decodes a large App ID as float64; never truncate a fraction. */}}
{{- if or (le $steamAppId 0) (gt $steamAppId 4294967295) (ne (float64 $configuredSteamAppId) (float64 $steamAppId)) }}
{{- fail "storeAuthentication.steamAppId is required and must be a positive 32-bit integer" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "avalon-api.fullname" . }}
  labels:
    {{- include "avalon-api.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "avalon-api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- if not .Values.existingSecret }}
        # Rolls the pods when a chart-managed secret changes, so a rotated signing key takes effect.
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "avalon-api.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: Application__StoreAuthentication__SteamAppId
              value: {{ $steamAppId | quote }}
            - name: Application__StoreAuthentication__SteamPublisherKey
              valueFrom:
                secretKeyRef:
                  name: {{ required "storeAuthentication.existingSecret is required" .Values.storeAuthentication.existingSecret | quote }}
                  key: {{ required "storeAuthentication.publisherKeyKey is required" .Values.storeAuthentication.publisherKeyKey | quote }}
            - name: Application__StoreAuthentication__Environment
              value: {{ .Values.storeAuthentication.environment | quote }}
            - name: Application__StoreAuthentication__SteamIdentityPrefix
              value: {{ .Values.storeAuthentication.steamIdentityPrefix | quote }}
            - name: Application__StoreAuthentication__PolicyVersion
              value: {{ .Values.storeAuthentication.policyVersion | quote }}
            - name: Kestrel__Endpoints__Public__Url
              value: {{ printf "http://0.0.0.0:%v" .Values.service.port | quote }}
            - name: Kestrel__Endpoints__GameInternal__Url
              value: {{ printf "https://0.0.0.0:%v" .Values.gameAdmission.port | quote }}
            - name: Kestrel__Endpoints__GameInternal__Certificate__Path
              value: /run/avalon-auth/api-workload.pfx
            - name: Kestrel__Endpoints__GameInternal__Certificate__Password
              valueFrom:
                secretKeyRef:
                  name: {{ required "gameAdmission.tlsExistingSecret is required" .Values.gameAdmission.tlsExistingSecret | quote }}
                  key: tls-password
                  optional: true
            {{- if not .Values.gameAdmission.servers }}
            {{- fail "gameAdmission.servers is required: bind each world to its TLS/workload certificates" }}
            {{- end }}
            {{- range $i, $server := .Values.gameAdmission.servers }}
            - name: Application__GameWorkloads__Servers__{{ $i }}__ServerId
              value: {{ required "gameAdmission serverId is required" $server.serverId | quote }}
            - name: Application__GameWorkloads__Servers__{{ $i }}__WorldId
              value: {{ required "gameAdmission worldId is required" $server.worldId | quote }}
            - name: Application__GameWorkloads__Servers__{{ $i }}__TlsServerName
              value: {{ required "gameAdmission tlsServerName is required" $server.tlsServerName | quote }}
            - name: Application__GameWorkloads__Servers__{{ $i }}__TlsCertificateSha256
              valueFrom:
                secretKeyRef:
                  name: {{ required "gameAdmission.bindingsExistingSecret is required" $.Values.gameAdmission.bindingsExistingSecret | quote }}
                  key: {{ printf "%s-tls-sha256" $server.serverId | quote }}
            - name: Application__GameWorkloads__Servers__{{ $i }}__ClientCertificateSha256
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.gameAdmission.bindingsExistingSecret | quote }}
                  key: {{ printf "%s-client-sha256" $server.serverId | quote }}
            {{- end }}
            # Secrets come from the Secret (templates/secret.yaml or existingSecret), never as
            # plain values in the pod spec (#482).
            - name: Database__Auth__ConnectionString
              valueFrom:
                secretKeyRef:
                  name: {{ include "avalon-api.secretName" . }}
                  key: database-auth-connection-string
            {{- range $id, $entry := .Values.worlds }}
            # World {{ $id }} (Database:Worlds, #523).
            - name: Database__Worlds__{{ $id }}__World__ConnectionString
              valueFrom:
                secretKeyRef:
                  name: {{ include "avalon-api.secretName" $ }}
                  key: {{ include "avalon-api.worldKey" (list $id $entry) | quote }}
            - name: Database__Worlds__{{ $id }}__Characters__ConnectionString
              valueFrom:
                secretKeyRef:
                  name: {{ include "avalon-api.secretName" $ }}
                  key: {{ include "avalon-api.charactersKey" (list $id $entry) | quote }}
            {{- end }}
            - name: Application__Cache__Password
              valueFrom:
                secretKeyRef:
                  name: {{ include "avalon-api.secretName" . }}
                  key: cache-password
                  optional: true
            - name: Application__Notification__PrivateKey
              valueFrom:
                secretKeyRef:
                  name: {{ include "avalon-api.secretName" . }}
                  key: notification-private-key
                  optional: true
            - name: Application__Balance__SharedSecret
              valueFrom:
                secretKeyRef:
                  name: {{ include "avalon-api.secretName" . }}
                  key: balance-shared-secret
                  optional: true
            {{- with .Values.balance.url }}
            - name: Application__Balance__Url
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.distribution.endpoint }}
            - name: Application__Distribution__Endpoint
              value: {{ . | quote }}
            - name: Application__Distribution__PublicUrl
              value: {{ $.Values.distribution.publicUrl | quote }}
            - name: Application__Distribution__Bucket
              value: {{ $.Values.distribution.bucket | quote }}
            - name: Application__Distribution__Region
              value: {{ $.Values.distribution.region | quote }}
            - name: Application__Distribution__AccessKeyId
              value: {{ $.Values.distribution.accessKeyId | quote }}
            - name: Application__Distribution__SecretAccessKey
              valueFrom:
                secretKeyRef:
                  name: {{ include "avalon-api.secretName" $ }}
                  key: distribution-secret-key
            {{- end }}
            - name: Application__Authentication__IssuerSigningKey
              valueFrom:
                secretKeyRef:
                  name: {{ include "avalon-api.secretName" . }}
                  key: jwt-signing-key
            # Not secret.
            - name: Application__Cache__Host
              value: {{ required "cache.host is required: host:port of Redis" .Values.cache.host | quote }}
            - name: Application__Notification__Subject
              value: {{ .Values.notification.subject | quote }}
            - name: Application__Notification__PublicKey
              value: {{ .Values.notification.publicKey | quote }}
            {{- range $i, $proxy := .Values.forwardedHeaders.knownProxies }}
            - name: Application__ForwardedHeaders__KnownProxies__{{ $i }}
              value: {{ $proxy | quote }}
            {{- end }}
            {{- range $i, $network := .Values.forwardedHeaders.knownNetworks }}
            - name: Application__ForwardedHeaders__KnownNetworks__{{ $i }}
              value: {{ $network | quote }}
            {{- end }}
            - name: Application__ForwardedHeaders__ForwardLimit
              value: {{ .Values.forwardedHeaders.forwardLimit | quote }}
            {{- /* Each only when set, so the API's own default applies otherwise; false and 0 are set values (#561). */}}
            {{- $rateLimiting := .Values.rateLimiting | default dict }}
            {{- if not (kindIs "invalid" $rateLimiting.enabled) }}
            - name: Application__RateLimiting__Enabled
              value: {{ $rateLimiting.enabled | quote }}
            {{- end }}
            {{- if not (kindIs "invalid" $rateLimiting.anonymousPermitsPerMinute) }}
            - name: Application__RateLimiting__AnonymousPermitsPerMinute
              value: {{ $rateLimiting.anonymousPermitsPerMinute | quote }}
            {{- end }}
            {{- if not (kindIs "invalid" $rateLimiting.authenticatedPermitsPerMinute) }}
            - name: Application__RateLimiting__AuthenticatedPermitsPerMinute
              value: {{ $rateLimiting.authenticatedPermitsPerMinute | quote }}
            {{- end }}
            {{- if not (kindIs "invalid" $rateLimiting.clientAuthPermitsPerMinute) }}
            - name: Application__RateLimiting__ClientAuthPermitsPerMinute
              value: {{ $rateLimiting.clientAuthPermitsPerMinute | quote }}
            {{- end }}
            {{- range $i, $id := .Values.templates.editableWorlds }}
            - name: {{ printf "Application__Templates__EditableWorlds__%d" $i }}
              value: {{ $id | toString | quote }}
            {{- end }}
            {{- with .Values.templates.reloadTimeout }}
            - name: Application__Templates__ReloadTimeout
              value: {{ . | quote }}
            {{- end }}
            {{- $steamWebLink := .Values.steamWebLink | default dict }}
            {{- with $steamWebLink.callbackUrl }}
            - name: Application__SteamWebLink__CallbackUrl
              value: {{ . | quote }}
            {{- end }}
            {{- with $steamWebLink.siteUrl }}
            - name: Application__SteamWebLink__SiteUrl
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.publicSiteUrl }}
            - name: Application__PublicSiteUrl
              value: {{ . | quote }}
            {{- end }}
            {{- if not (kindIs "invalid" .Values.publicWorldId) }}
            - name: Application__PublicWorldId
              value: {{ .Values.publicWorldId | quote }}
            {{- end }}
            - name: DOTNET_HOSTBUILDER__RELOADCONFIGONCHANGE
              value: "false"
            {{- with .Values.otel.endpoint }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ . | quote }}
            - name: OTEL_SERVICE_NAME
              value: {{ $.Values.otel.serviceName | default (include "avalon-api.fullname" $) | quote }}
            {{- $attrs := list }}
            {{- range $key, $value := $.Values.otel.resourceAttributes }}
            {{- $attrs = append $attrs (printf "%s=%v" $key $value) }}
            {{- end }}
            {{- with $attrs }}
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: {{ join "," . | quote }}
            {{- end }}
            {{- end }}
            - name: ASPNETCORE_ENVIRONMENT
              value: {{ .Values.environment | quote }}
            - name: Application__MapAssets__ChunkAssetRoot
              value: {{ .Values.mapAssets.chunkAssetRoot | quote }}
          volumeMounts:
            - name: api-admission-credentials
              mountPath: /run/avalon-auth
              readOnly: true
          ports:
            - name: game-internal
              containerPort: {{ .Values.gameAdmission.port }}
              protocol: TCP
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /alive
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: api-admission-credentials
          secret:
            secretName: {{ .Values.gameAdmission.tlsExistingSecret | quote }}
            items:
              - key: tls.pfx
                path: api-workload.pfx
