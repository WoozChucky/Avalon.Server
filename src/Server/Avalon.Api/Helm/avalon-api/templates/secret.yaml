{{- /*
Every secret the api reads, kept out of the pod spec (#482): the Deployment references these keys
with secretKeyRef. Skipped when existingSecret names a Secret you manage, which must hold the same
keys (cache-password, notification-private-key and balance-shared-secret may be left out; the world
keys are per world, worlds.<id>.worldKey and worlds.<id>.charactersKey, see values.yaml). The
signing keys are trimmed, so a key file's trailing newline passed with --set-file does not reach the
api, which would refuse it. Identity's private key and game-auth host key (#801) are required, and
held only where identity runs. The auth connection string is required and trimmed the same way
(#564), so a release without it refuses to render rather than start an api that fails its startup
validation. It holds only the keys of the services the release runs (#794, design D9.3); a routes
release has no Secret.
*/}}
{{- $services := include "avalon-api.services" . | fromJsonArray }}
{{- if $services }}
{{- $parts := include "avalon-api.worldParts" $services | fromJsonArray }}
{{- $gameAuth := .Values.gameAuth | default dict }}
{{- if not .Values.existingSecret }}
{{- $privateKey := .Values.authentication.signingKey | default "" | toString | trim }}
{{- $hostKey := $gameAuth.hostKey | default "" | toString | trim }}
{{- $authConnectionString := .Values.database.auth.connectionString | default "" | toString | trim }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "avalon-api.secretName" . }}
  labels:
    {{- include "avalon-api.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if has "identity" $services }}
  jwt-signing-private-key: {{ required "authentication.signingKey is required where identity runs unless existingSecret is set: identity's EC P-256 private key, PKCS#8 PEM. Pass it with --set-file authentication.signingKey=<file>, or name a Secret you manage with existingSecret." $privateKey | quote }}
  game-auth-host-key: {{ required "gameAuth.hostKey is required where identity runs unless existingSecret is set: the key identity's game-auth cryptography derives its keys from, a random value of at least 32 bytes, or in a deployment from before #801 the value its HS256 key held. Pass it with --set-file gameAuth.hostKey=<file>, or name a Secret you manage with existingSecret." $hostKey | quote }}
  {{- end }}
  database-auth-connection-string: {{ required "database.auth.connectionString is required unless existingSecret is set: the shared auth database. Pass it with --set-file database.auth.connectionString=<file>, or name a Secret you manage with existingSecret." $authConnectionString | quote }}
  {{- if $parts }}
  {{- range $id, $entry := .Values.worlds }}
  {{- if has "world" $parts }}
  {{ include "avalon-api.worldKey" (list $id $entry) }}: {{ dig "world" "connectionString" "" ($entry | default dict) | toString | trim | quote }}
  {{- end }}
  {{ include "avalon-api.charactersKey" (list $id $entry) }}: {{ dig "characters" "connectionString" "" ($entry | default dict) | toString | trim | quote }}
  {{- end }}
  {{- end }}
  {{- if or (has "identity" $services) (has "worlds" $services) (has "commerce" $services) }}
  cache-password: {{ .Values.cache.password | default "" | quote }}
  {{- end }}
  {{- if has "identity" $services }}
  notification-private-key: {{ .Values.notification.privateKey | default "" | quote }}
  {{- end }}
  {{- if has "distribution" $services }}
  distribution-secret-key: {{ .Values.distribution.secretAccessKey | default "" | quote }}
  {{- end }}
  {{- if has "worlds" $services }}
  balance-shared-secret: {{ .Values.balance.sharedSecret | default "" | quote }}
  {{- end }}
{{- else }}
{{- /* With existingSecret the chart reads nothing it was given; refuse rather than ignore it. */}}
{{- $given := list }}
{{- if .Values.authentication.signingKey }}{{ $given = append $given "authentication.signingKey" }}{{ end }}
{{- if $gameAuth.hostKey }}{{ $given = append $given "gameAuth.hostKey" }}{{ end }}
{{- if .Values.database.auth.connectionString }}{{ $given = append $given "database.auth.connectionString" }}{{ end }}
{{- range $id, $entry := .Values.worlds }}
{{- if dig "world" "connectionString" "" ($entry | default dict) }}{{ $given = append $given (printf "worlds.%s.world.connectionString" $id) }}{{ end }}
{{- if dig "characters" "connectionString" "" ($entry | default dict) }}{{ $given = append $given (printf "worlds.%s.characters.connectionString" $id) }}{{ end }}
{{- end }}
{{- if .Values.cache.password }}{{ $given = append $given "cache.password" }}{{ end }}
{{- if .Values.notification.privateKey }}{{ $given = append $given "notification.privateKey" }}{{ end }}
{{- if .Values.distribution.secretAccessKey }}{{ $given = append $given "distribution.secretAccessKey" }}{{ end }}
{{- if .Values.balance.sharedSecret }}{{ $given = append $given "balance.sharedSecret" }}{{ end }}
{{- if $given }}
{{- fail (printf "existingSecret is set to %q, so the chart reads every secret from it and would ignore %s. Put those values in the Secret and unset them here, or unset existingSecret." .Values.existingSecret (join ", " $given)) }}
{{- end }}
{{- end }}
{{- end }}
