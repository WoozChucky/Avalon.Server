{{- /*
Every secret the api reads, kept out of the pod spec (#482): the Deployment references these keys
with secretKeyRef. Skipped when existingSecret names a Secret you manage, which must hold the same
keys (cache-password and notification-private-key may be left out; the world keys are per world,
worlds.<id>.worldKey and worlds.<id>.charactersKey, see values.yaml). The signing key is trimmed, so
a key file's trailing newline passed with --set-file does not reach the api, which would refuse it.
*/}}
{{- if not .Values.existingSecret }}
{{- $signingKey := .Values.authentication.issuerSigningKey | default "" | toString | trim }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "avalon-api.secretName" . }}
  labels:
    {{- include "avalon-api.labels" . | nindent 4 }}
type: Opaque
stringData:
  jwt-signing-key: {{ required "authentication.issuerSigningKey is required unless existingSecret is set: a random value of at least 32 bytes. Pass it with --set-file authentication.issuerSigningKey=<file>, or name a Secret you manage with existingSecret." $signingKey | quote }}
  database-auth-connection-string: {{ .Values.database.auth.connectionString | default "" | quote }}
  {{- range $id, $entry := .Values.worlds }}
  {{ include "avalon-api.worldKey" (list $id $entry) }}: {{ dig "world" "connectionString" "" ($entry | default dict) | toString | trim | quote }}
  {{ include "avalon-api.charactersKey" (list $id $entry) }}: {{ dig "characters" "connectionString" "" ($entry | default dict) | toString | trim | quote }}
  {{- end }}
  cache-password: {{ .Values.cache.password | default "" | quote }}
  notification-private-key: {{ .Values.notification.privateKey | default "" | quote }}
{{- else }}
{{- /* With existingSecret the chart reads nothing it was given; refuse rather than ignore it. */}}
{{- $given := list }}
{{- if .Values.authentication.issuerSigningKey }}{{ $given = append $given "authentication.issuerSigningKey" }}{{ end }}
{{- if .Values.database.auth.connectionString }}{{ $given = append $given "database.auth.connectionString" }}{{ end }}
{{- range $id, $entry := .Values.worlds }}
{{- if dig "world" "connectionString" "" ($entry | default dict) }}{{ $given = append $given (printf "worlds.%s.world.connectionString" $id) }}{{ end }}
{{- if dig "characters" "connectionString" "" ($entry | default dict) }}{{ $given = append $given (printf "worlds.%s.characters.connectionString" $id) }}{{ end }}
{{- end }}
{{- if .Values.cache.password }}{{ $given = append $given "cache.password" }}{{ end }}
{{- if .Values.notification.privateKey }}{{ $given = append $given "notification.privateKey" }}{{ end }}
{{- if $given }}
{{- fail (printf "existingSecret is set to %q, so the chart reads every secret from it and would ignore %s. Put those values in the Secret and unset them here, or unset existingSecret." .Values.existingSecret (join ", " $given)) }}
{{- end }}
{{- end }}
