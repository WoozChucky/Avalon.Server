apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "avalon-api.fullname" . }}
  labels:
    {{- include "avalon-api.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "avalon-api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- if not .Values.existingSecret }}
        # Rolls the pods when a chart-managed secret changes, so a rotated signing key takes effect.
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "avalon-api.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            # Secrets come from the Secret (templates/secret.yaml or existingSecret), never as
            # plain values in the pod spec (#482).
            - name: Database__Auth__ConnectionString
              valueFrom:
                secretKeyRef:
                  name: {{ include "avalon-api.secretName" . }}
                  key: database-auth-connection-string
            - name: Database__Characters__ConnectionString
              valueFrom:
                secretKeyRef:
                  name: {{ include "avalon-api.secretName" . }}
                  key: database-characters-connection-string
            - name: Database__World__ConnectionString
              valueFrom:
                secretKeyRef:
                  name: {{ include "avalon-api.secretName" . }}
                  key: database-world-connection-string
            - name: Application__Cache__Password
              valueFrom:
                secretKeyRef:
                  name: {{ include "avalon-api.secretName" . }}
                  key: cache-password
                  optional: true
            - name: Application__Notification__PrivateKey
              valueFrom:
                secretKeyRef:
                  name: {{ include "avalon-api.secretName" . }}
                  key: notification-private-key
                  optional: true
            - name: Application__Authentication__IssuerSigningKey
              valueFrom:
                secretKeyRef:
                  name: {{ include "avalon-api.secretName" . }}
                  key: jwt-signing-key
            # Not secret.
            - name: Application__Cache__Host
              value: {{ .Values.cache.host | quote }}
            - name: Application__Notification__Subject
              value: {{ .Values.notification.subject | quote }}
            - name: Application__Notification__PublicKey
              value: {{ .Values.notification.publicKey | quote }}
            {{- range $i, $proxy := .Values.forwardedHeaders.knownProxies }}
            - name: Application__ForwardedHeaders__KnownProxies__{{ $i }}
              value: {{ $proxy | quote }}
            {{- end }}
            {{- range $i, $network := .Values.forwardedHeaders.knownNetworks }}
            - name: Application__ForwardedHeaders__KnownNetworks__{{ $i }}
              value: {{ $network | quote }}
            {{- end }}
            - name: Application__ForwardedHeaders__ForwardLimit
              value: {{ .Values.forwardedHeaders.forwardLimit | quote }}
            - name: DOTNET_HOSTBUILDER__RELOADCONFIGONCHANGE
              value: "false"
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            timeoutSeconds: 30
            periodSeconds: 60
            successThreshold: 1
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            timeoutSeconds: 5
            periodSeconds: 15
            successThreshold: 1
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
