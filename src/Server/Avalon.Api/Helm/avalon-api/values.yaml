# Secrets: the connection strings, cache.password, notification.privateKey and identity's keys
# (authentication.signingKey, gameAuth.hostKey) reach the pod through a Kubernetes Secret
# (secretKeyRef), never as plain values in the pod spec. Either:
#  - name a Secret you manage in existingSecret (preferred: the values never pass through Helm). It
#    needs the keys database-auth-connection-string, jwt-signing-private-key and game-auth-host-key
#    (where identity runs), one pair per world (worlds.<id>, below), plus cache-password (or the key
#    cache.passwordKey names), notification-private-key, distribution-secret-key and balance-shared-secret if used. Leave every
#    secret value below empty: the chart refuses to render with existingSecret set and a value
#    given, rather than ignore it. The chart cannot see a change to your Secret, so after rotating
#    a key in it restart the pods yourself:
#    kubectl rollout restart deployment/<release>-avalon-api (the chart's fullname); or
#  - leave existingSecret empty and supply the values below; the chart then creates the Secret, and
#    a checksum annotation restarts the pods whenever it changes.
#    Pass them from files, not the command line, so they stay out of shell history:
#    --set-file authentication.signingKey=./jwt-es256.pem (a trailing newline is trimmed).
# A release that names its services (services, below) reads only their keys (#794):
#  - every service: database-auth-connection-string (#801: the services check access tokens with
#    the public keys in authentication.validationKeys, which are plain values);
#  - identity: jwt-signing-private-key, game-auth-host-key, each world's characters key,
#    cache-password, notification-private-key;
#  - worlds: each world's world and characters keys, cache-password, balance-shared-secret;
#  - commerce: cache-password (its provider keys are in commerce.existingSecret);
#  - distribution: distribution-secret-key.
existingSecret: ""

# The API services this release runs (#794): any of identity, worlds, commerce and distribution,
# rendered as Application__Services__<n>. Left out, the release runs all four in one process, as
# before the split. A service's values below reach the pod only when it is listed, so one release
# per service holds only that service's settings and Secret keys. Only identity serves game
# admission (gameAdmission, port 9443) and migrates the auth database; a release without it waits
# for those migrations at startup (startup.authSchemaWaitSeconds). An empty list renders no pods
# and is accepted only with routes.enabled.
# services: [identity, worlds, commerce, distribution]

startup:
  # How long a release without identity waits at startup for identity to apply the auth database's
  # migrations (Application:Startup:AuthSchemaWaitSeconds, whole seconds, at least 1) before it
  # fails and restarts; its startupProbe allows this long and a minute more.
  authSchemaWaitSeconds: 300

# Routes mode (#794): a release with routes.enabled and services: [] renders only a Traefik
# IngressRoute and no pods. It sends each path under pathPrefix on hosts to the Service of the API
# service that owns it, by the route manifest files/routes.json (a rule /x matches /x and the paths
# under it, ignoring case after the prefix; the deepest rule wins; identity takes the rest).
routes:
  enabled: false
  # The hosts the routes answer on, e.g. [avalon.example, admin.avalon.example]. Required.
  hosts: []
  # The prefix the API is served under on those hosts, with no '/' at the end; empty for the root.
  pathPrefix: /api
  # Traefik Middlewares, in the release's namespace, each route passes through, e.g. the one that
  # strips pathPrefix: [avalon-strip-api].
  middlewares: []
  # The Service each API service's requests go to, reached on service.port; all four required,
  # e.g. {identity: avalon-api, worlds: avalon-api-worlds, commerce: avalon-api, distribution: avalon-api}.
  backends: {}
  # Rollout moves: a path inside one service's rules sent to another Service, ahead of every rule,
  # e.g. [{path: /world/1, service: worlds, backend: avalon-api-worlds}]. The path is written as the
  # manifest writes rules; one the manifest gives to another service, or with another service's
  # rule under it, refuses to render.
  overrides: []

# NetworkPolicy for the API pods, off by default (#794 hardening). On, the API's port admits only
# ingressController (and, where worlds runs, publicSite, for link previews), and the game admission
# port, where identity runs, only worldServers. Each is a list of NetworkPolicy peers
# (podSelector, namespaceSelector, ipBlock); the chart refuses to enable it without the peers a port
# needs, since a rule with none would admit every source. Probes come from the node: add its range
# to ingressController if your network policy implementation does not admit node traffic.
networkPolicy:
  enabled: false
  ingressController: []
  publicSite: []
  worldServers: []

# The shared auth database. Unless existingSecret is set, the chart refuses to render without it
# (#564); pass it from a file: --set-file database.auth.connectionString=./auth.cs (a trailing
# newline is trimmed). With existingSecret, leave it empty: your Secret holds it under
# database-auth-connection-string.
database:
  auth:
    connectionString:

# The worlds this API serves (Database:Worlds, #523), keyed by each world's id in the auth Worlds
# table: a positive integer, as a string key. Each world has its own world (content) and characters
# database. At least one is required; the chart refuses to render without one. Adding a world is a
# values change only.
#  - Without existingSecret, give both strings, from files so they stay out of shell history:
#      --set-file worlds.2.world.connectionString=./world-2.cs
#      --set-file worlds.2.characters.connectionString=./characters-2.cs
#    The chart's Secret holds them under database-world-<id>-connection-string and
#    database-characters-<id>-connection-string (a trailing newline is trimmed).
#  - With existingSecret, give no strings here: name the keys of your Secret that hold them
#    (worldKey, charactersKey), or leave them empty for the default names above. Each key must be
#    a valid Secret key name, and no two settings may name one key (the chart's own keys above
#    included). Without existingSecret, worldKey and charactersKey are refused.
worlds: {}
#  "1":
#    world:
#      connectionString:
#    characters:
#      connectionString:
#    worldKey: ""
#    charactersKey: ""

# cache.host is required (host:port of Redis); the chart refuses to render without it.
# cache.username (#803) is the Redis ACL user the release signs in as (Application:Cache:Username);
# left out, it signs in as the default user with the password alone. The password is the Secret's
# cache-password, or, with existingSecret, the key cache.passwordKey names: a release switching to its
# own user can read that user's password from a new key, so the default user's password under
# cache-password stays in place until the switch is done.
cache:
  host:
  username: ""
  password:
  passwordKey: ""

# Access tokens (#801) are ES256 only. Identity signs them with an EC P-256 private key no other
# service holds, under a key id; every service checks them with the public keys listed here by key id,
# and refuses HS256, which they were signed with before. See docs/development-setup.md ("REST API
# signing key") for making a key pair and rotating it. The HS256 values are gone, and the chart refuses
# them: authentication.legacyIssuerSigningKey and authentication.issuerSigningKey.
authentication:
  # The key id identity writes into its tokens, e.g. "2026-10" (at most 64 letters, digits, '.', '_'
  # and '-'). Required where identity runs.
  signingKeyId: ""
  # Without existingSecret: identity's private key, PKCS#8 PEM, from a file:
  # --set-file authentication.signingKey=./jwt-es256.pem. Never commit it here. With existingSecret, the
  # Secret's jwt-signing-private-key holds it. Rendered only where identity runs.
  signingKey:
  # Identity's public keys by key id: the base64 of each key's DER SubjectPublicKeyInfo. Public, not
  # secret, so plain values, e.g. {"2026-10": MFkwEwYH...}. Required where identity does not run;
  # identity knows its own key without it. During a rotation list the old and the new key.
  validationKeys: {}

# The key identity's game-auth cryptography (proofs, replay receipts, the Steam OpenID state) derives
# its keys from (#801), a random value of at least 32 bytes: in a deployment from before #801, the
# value of the HS256 key (the Secret's old jwt-signing-key), so what was protected with it stays
# readable. Required where identity runs, and rendered only there: without existingSecret pass it with
# --set-file gameAuth.hostKey=./host.key; with it, the Secret's game-auth-host-key holds it.
gameAuth:
  hostKey:

notification:
  subject:
  publicKey:
  privateKey:

# The reverse proxies whose X-Forwarded-For the API believes (Application:ForwardedHeaders). The
# caller's address is its login source: with the ingress left untrusted, every caller behind it is
# one source, and ten failed logins by anyone refuse REST logins for everyone. List the ingress's
# addresses, or the narrowest network it runs in (for example the cluster's pod CIDR). Loopback is
# always trusted. A network wider than /8 (IPv4) or /32 (IPv6), 0.0.0.0/0 and ::/0 included, stops the
# API at startup: callers on it could choose their own source. Outside Development the API logs a
# warning when both lists are empty.
forwardedHeaders:
  knownProxies: []
  knownNetworks: []
  # Proxy hops read from X-Forwarded-For, from the right; at least 1.
  forwardLimit: 1

# Request rate limiting (Application:RateLimiting, #561): a sliding window of one minute, per account
# for a signed-in caller and per source address (IPv4, or IPv6 /64) for anyone else; /health and
# /alive are never limited. Left empty, the API's defaults apply: enabled, 60 anonymous and 300
# authenticated requests a minute, and 20 launcher sign-in requests a minute per source on top (#591).
# A limit below 1 stops the API at startup. The limiter is in memory,
# so each replica counts on its own.
rateLimiting:
  enabled:
  anonymousPermitsPerMinute:
  authenticatedPermitsPerMinute:
  clientAuthPermitsPerMinute:
  # Sources exempt from every per-source limit (Application:RateLimiting:ExemptSources), for every
  # service: the request limits above and, in identity, the per-source failed-login and account-creation
  # budgets. Per-account and per-username limits still apply. IP addresses or CIDR ranges, rendered as
  # indexed env, e.g. [203.0.113.7/32] for one load-test machine. The API refuses at startup an entry it
  # cannot read exactly, a range wider than /24 (IPv4) or /64 (IPv6), one with host bits set, and one
  # overlapping loopback or forwardedHeaders. List single machines, and remove them after the run.
  exemptSources: []

# Load-test bot accounts (Application:LoadTest), identity only: POST and DELETE
# /admin/load-test/accounts, for admins. Disabled, both answer 404. maxAccounts caps the load-test
# accounts that may exist at once (a whole number, at least 1).
loadTest:
  enabled: false
  maxAccounts: 5000

# The world public tooltip links read when they name none (Application:PublicWorldId): the id of the
# live world in the auth Worlds table. Left empty, GET /public/world falls back to the first world the
# caller may read.
publicWorldId:

# The public website's base URL (Application:PublicSiteUrl), e.g. https://avalon.example: the address link
# previews name as a page's og:url. Left empty, previews leave og:url out and link relatively.
publicSiteUrl: ""
# Required runtime URLs for website Steam linking. Use the actual public HTTPS URLs,
# including any API proxy prefix. These are addresses, never publisher secrets.
steamWebLink:
  callbackUrl: ""
  siteUrl: ""


# Email (Application:Email) is not set by the chart. The only sender so far, Pickup, writes .eml files
# to local disk and the API refuses it outside Development, so a chart deployment has no sender and
# email change answers 501. A real provider will add its settings here.

# Live template editing (Application:Templates): the worlds on which admins may edit item, ability and
# creature templates, by world id (the auth Worlds table), rendered as indexed env. Left empty, no world
# is editable and the PUT endpoints answer 403. Keep production worlds out of this list: an edit applies to
# the running world on save. reloadTimeout is how long a save waits for the world's reload answer before
# reporting it pending (a TimeSpan, e.g. 00:00:10); left empty, the API's appsettings default applies.
templates:
  editableWorlds: []
  reloadTimeout: ""

replicaCount: 1

image:
  repository: ghcr.io/woozchucky/avalon-server/api
  pullPolicy: IfNotPresent
  # Empty means the chart's appVersion, which the release sets to the git tag.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 8080

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# ASP.NET Core environment. Health endpoints are mapped in every environment.
environment: Production

# Website checkout is off on existing deployments. Enable only on separately isolated sandbox storage.
commerce:
  enabled: false
  # Opt in to sandbox payments granting licenses to the existing production account environment.
  # Payment credentials and provider evidence must still be test-mode only.
  allowExistingAccountSandbox: false
  provider: stripe
  paymentEnvironment: sandbox
  licenseEnvironment: development
  amountMinor: 800
  currency: eur
  quantity: 1
  product: avalon.base
  providerProduct: base
  publicSiteOrigin: ""
  offerId: ""
  providerPriceId: ""
  providerCatalogProductId: ""
  providerAccountId: ""
  paymentMethods: [card]
  existingSecret: ""
  apiKeyKey: stripe-api-key
  webhookSecretKey: stripe-webhook-secret

# Provider credentials are references only. None leaves account verification/email changes off.
# Pickup is a local Development sender; this deployment chart accepts None or Resend.
email:
  sender: None
  from: ""
  fromName: Avalon
  verificationSiteOrigin: ""
  existingSecret: ""
  resendApiKeyKey: resend-api-key
  verificationCooldownSeconds: 60
  maxVerificationSendsPerAccount: 5
  maxVerificationSendsPerSource: 20

mapAssets:
  # Where the image keeps the World chunk assets (see Avalon.Api.csproj).
  chunkAssetRoot: /app/Maps

# OpenTelemetry export (OTLP gRPC), e.g. http://otel-collector:4317.
# Empty: nothing is exported.
otel:
  endpoint: ""
  # Defaults to the release's full name.
  serviceName: ""
  # Extra resource attributes, e.g. {deployment.environment: production}.
  resourceAttributes: {}

# The balance service the admin /balance endpoints forward to (Avalon.Balance.Service, in cluster).
# Empty url: nothing rendered and those endpoints answer 503. The shared secret is the key
# "balance-shared-secret" of existingSecret (the same value the service holds), or sharedSecret below.
balance:
  url: ""
  sharedSecret: ""

# Game distribution (Garage/S3, see homelab docs/avalon.md). Empty endpoint: the /client endpoints
# answer 503. publicUrl is the host presigned links point at; the key should be read-only. The
# secret key goes in existingSecret as "distribution-secret-key", or in secretAccessKey below.
distribution:
  endpoint: ""
  publicUrl: ""
  bucket: avalon-dist
  region: garage
  accessKeyId: ""
  secretAccessKey: ""

# Mandatory store verification credentials. Only a reference is accepted; Helm never holds the publisher key.
storeAuthentication:
  steamAppId: 0 # Required deployment configuration; zero refuses rendering/startup.
  steamPlaytest:
    enabled: false
    appId: 0 # A distinct positive uint32 ID is required when enabled.
    allowedWorldIds: [] # Distinct positive uint16 IDs; required when enabled.
  existingSecret: ""
  publisherKeyKey: steam-publisher-key
  environment: production
  steamIdentityPrefix: avalon-auth-prod
  policyVersion: 1

# Direct mTLS listener, separate from public ingress. Pins are read from the binding Secret,
# using <serverId>-tls-sha256 and <serverId>-client-sha256 keys. Supply one entry per served world.
gameAdmission:
  port: 9443
  tlsExistingSecret: ""
  bindingsExistingSecret: ""
  servers: [] # {serverId: world-dev, worldId: 1, tlsServerName: dev.example.test}
