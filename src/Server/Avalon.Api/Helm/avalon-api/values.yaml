# Secrets: the connection strings, cache.password, notification.privateKey and
# authentication.issuerSigningKey reach the pod through a Kubernetes Secret (secretKeyRef), never as
# plain values in the pod spec. Either:
#  - name a Secret you manage in existingSecret (preferred: the values never pass through Helm). It
#    needs the keys database-auth-connection-string, database-characters-connection-string,
#    database-world-connection-string and jwt-signing-key, plus cache-password and
#    notification-private-key if used; or
#  - leave existingSecret empty and supply the values below; the chart then creates the Secret.
#    Pass them from files, not the command line, so they stay out of shell history:
#    --set-file authentication.issuerSigningKey=./jwt.key (a trailing newline is trimmed).
existingSecret: ""

database:
  auth:
    connectionString:
  characters:
    connectionString:
  world:
    connectionString:
      
cache:
  host:
  password:

# The JWT signing key, a random value of at least 32 bytes. Never commit it here. Unless existingSecret
# is set, the chart refuses to render without it.
authentication:
  issuerSigningKey:

notification:
  subject:
  publicKey:
  privateKey:

replicaCount: 1

image:
  repository: <YOUR_REGISTRY>/avalon/avalon-api
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: latest

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 8080

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80
