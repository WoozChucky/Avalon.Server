# Secrets: the connection strings, cache.password, notification.privateKey and
# authentication.issuerSigningKey reach the pod through a Kubernetes Secret (secretKeyRef), never as
# plain values in the pod spec. Either:
#  - name a Secret you manage in existingSecret (preferred: the values never pass through Helm). It
#    needs the keys database-auth-connection-string and jwt-signing-key, one pair per world
#    (worlds.<id>, below), plus cache-password, notification-private-key and distribution-secret-key if used. Leave every
#    secret value below empty: the chart refuses to render with existingSecret set and a value
#    given, rather than ignore it. The chart cannot see a change to your Secret, so after rotating
#    a key in it restart the pods yourself:
#    kubectl rollout restart deployment/<release>-avalon-api (the chart's fullname); or
#  - leave existingSecret empty and supply the values below; the chart then creates the Secret, and
#    a checksum annotation restarts the pods whenever it changes.
#    Pass them from files, not the command line, so they stay out of shell history:
#    --set-file authentication.issuerSigningKey=./jwt.key (a trailing newline is trimmed).
existingSecret: ""

# The shared auth database. Unless existingSecret is set, the chart refuses to render without it
# (#564); pass it from a file: --set-file database.auth.connectionString=./auth.cs (a trailing
# newline is trimmed). With existingSecret, leave it empty: your Secret holds it under
# database-auth-connection-string.
database:
  auth:
    connectionString:

# The worlds this API serves (Database:Worlds, #523), keyed by each world's id in the auth Worlds
# table: a positive integer, as a string key. Each world has its own world (content) and characters
# database. At least one is required; the chart refuses to render without one. Adding a world is a
# values change only.
#  - Without existingSecret, give both strings, from files so they stay out of shell history:
#      --set-file worlds.2.world.connectionString=./world-2.cs
#      --set-file worlds.2.characters.connectionString=./characters-2.cs
#    The chart's Secret holds them under database-world-<id>-connection-string and
#    database-characters-<id>-connection-string (a trailing newline is trimmed).
#  - With existingSecret, give no strings here: name the keys of your Secret that hold them
#    (worldKey, charactersKey), or leave them empty for the default names above. Each key must be
#    a valid Secret key name, and no two settings may name one key (the chart's own keys above
#    included). Without existingSecret, worldKey and charactersKey are refused.
worlds: {}
#  "1":
#    world:
#      connectionString:
#    characters:
#      connectionString:
#    worldKey: ""
#    charactersKey: ""

# cache.host is required (host:port of Redis); the chart refuses to render without it.
cache:
  host:
  password:

# The JWT signing key, a random value of at least 32 bytes. Never commit it here. Unless existingSecret
# is set, the chart refuses to render without it.
authentication:
  issuerSigningKey:

notification:
  subject:
  publicKey:
  privateKey:

# The reverse proxies whose X-Forwarded-For the API believes (Application:ForwardedHeaders). The
# caller's address is its login source: with the ingress left untrusted, every caller behind it is
# one source, and ten failed logins by anyone refuse REST logins for everyone. List the ingress's
# addresses, or the narrowest network it runs in (for example the cluster's pod CIDR). Loopback is
# always trusted. A network wider than /8 (IPv4) or /32 (IPv6), 0.0.0.0/0 and ::/0 included, stops the
# API at startup: callers on it could choose their own source. Outside Development the API logs a
# warning when both lists are empty.
forwardedHeaders:
  knownProxies: []
  knownNetworks: []
  # Proxy hops read from X-Forwarded-For, from the right; at least 1.
  forwardLimit: 1

# Email (Application:Email) is not set by the chart. The only sender so far, Pickup, writes .eml files
# to local disk and the API refuses it outside Development, so a chart deployment has no sender and
# email change answers 501. A real provider will add its settings here.

replicaCount: 1

image:
  repository: ghcr.io/woozchucky/avalon-server/api
  pullPolicy: IfNotPresent
  # Empty means the chart's appVersion, which the release sets to the git tag.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 8080

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# ASP.NET Core environment. Health endpoints are mapped in every environment.
environment: Production

mapAssets:
  # Where the image keeps the World chunk assets (see Avalon.Api.csproj).
  chunkAssetRoot: /app/Maps

# OpenTelemetry export (OTLP gRPC), e.g. http://otel-collector:4317.
# Empty: nothing is exported.
otel:
  endpoint: ""
  # Defaults to the release's full name.
  serviceName: ""
  # Extra resource attributes, e.g. {deployment.environment: production}.
  resourceAttributes: {}

# Game distribution (Garage/S3, see homelab docs/avalon.md). Empty endpoint: the /client endpoints
# answer 503. publicUrl is the host presigned links point at; the key should be read-only. The
# secret key goes in existingSecret as "distribution-secret-key", or in secretAccessKey below.
distribution:
  endpoint: ""
  publicUrl: ""
  bucket: avalon-dist
  region: garage
  accessKeyId: ""
  secretAccessKey: ""
