# Name of a Secret you manage holding database-auth-connection-string,
# database-characters-connection-string, database-world-connection-string and cache-password.
# When empty, the chart renders one from server.* below.
existingSecret: ""

# ASP.NET Core / generic host environment.
environment: Production

server:
  hosting:
    host: "0.0.0.0"
  # PROXY protocol v2 from an L4 proxy in front (e.g. Caddy layer4): the real client address
  # instead of the proxy's, so per-source limits apply per player. Connections from
  # trustedProxies (CIDR) must start with the header; others are read as direct clients.
  # Whoever can connect from a trusted address can name any client, so enabling it requires, with
  # service.type LoadBalancer, service.loadBalancerSourceRanges (only the proxies may reach the node's
  # port; the chart allocates no NodePort, which would bypass them), and with any other type
  # networkPolicy below. A trusted pod network wants networkPolicy in both, so no other pod can dial
  # the world pod directly.
  proxyProtocol:
    enabled: false
    trustedProxies: []
    headerTimeoutSeconds: 5
  # Required transport credentials supplied by an externally managed Kubernetes Secret.
  # Keys: world-tls.pfx, workload.pfx; optional world-tls-password, workload-password.
  transport:
    existingSecret: ""
  admission:
    apiUrl: ""  # HTTPS origin of the API GameInternal endpoint, ending in /.
    serverId: ""  # Must match the API workload assignment for game.worldId.
    apiCertificateSecret: ""  # Required Secret containing the exact API leaf SHA-256 pin.
    apiCertificateKey: api-tls-sha256
    # The per-source budget at the world's door (#1052): one past any of these is answered ServiceUnavailable
    # before its ticket is redeemed. Whole numbers; each renders only when set, and empty is the world's default.
    # World:Admission:MaxInFlightPerSource: admissions one source (an IPv4 address, an IPv6 /64) may have in
    # flight, 1 to 128; default 16.
    maxInFlightPerSource: ""
    # World:Admission:MaxInFlightPerIPv6Block: admissions one IPv6 /56 may have in flight, at least
    # maxInFlightPerSource, at most 128; default 32.
    maxInFlightPerIPv6Block: ""
    # World:Admission:MaxPerSourcePerMinute: admissions one source may start a minute, 1 to 60000; default 120.
    maxPerSourcePerMinute: ""
    # World:Admission:MaxPerIPv6BlockPerMinute: admissions one IPv6 /56 may start a minute, at least
    # maxPerSourcePerMinute, at most 240000; default 480.
    maxPerIPv6BlockPerMinute: ""
    # Sources that budget does not count (World:Admission:ExemptSources): load machines, as addresses or CIDR networks
    # no wider than /24 or /64, none covering loopback or a trusted proxy. Rendered only when set; e.g. [10.10.1.21/32]
    # for the load-test bot PC on the load-test world.
    exemptSources: []
  cache:
    # Required: host:port of Redis.
    host: ""
    # Secret: ignored (and refused) when existingSecret is set.
    password: ""
  database:
    # Secrets: ignored (and refused) when existingSecret is set.
    auth:
      connectionString: ""
    characters:
      connectionString: ""
    world:
      connectionString: ""
  game:
    worldId: 1
    playerRadius: 2000
    maxCharactersPerAccount: 5
    # Minutes an emptied dungeon instance lives (Game:AbandonedInstanceLifetimeMinutes): re-entry within it returns
    # the same instance. 0 frees it on the next tick, so every entry builds a new one (a load-test world). Empty:
    # the world's default, 15.
    abandonedInstanceLifetimeMinutes: ""
    # The world's own player limit for its backstop (#967): Game:PlayerLimit, 1 to 100000. Empty: no backstop. Set it to
    # the same number as the world's stored limit (PUT /world/{id}/player-limit), which identity enforces with the
    # queue; this one only guards the pod. A change rolls the pod.
    playerLimit: ""
    # The backstop's margin over that limit: Game:PlayerLimitMarginPercent, in percent of the limit, and
    # Game:PlayerLimitMarginMinimum, in connections; the larger applies. Empty: the world's defaults, 5 and 20.
    playerLimitMarginPercent: ""
    playerLimitMarginMinimum: ""
  # The per-packet session encryption (Network:PacketEncryption, #875): AES-GCM on every gameplay payload inside TLS.
  # false (the default): TLS alone. Read at startup: a change rolls the pod. true or false only.
  network:
    packetEncryption: false
  # Where the tick thread runs (#1002), Linux only. Both empty (off) by default and rendered only when set; read at
  # startup, so a change rolls the pod. docs/world-simulation.md ("Tick thread placement") has the steps to check it.
  tickThread:
    # Game:TickThreadCpu: the CPU the tick thread runs on alone; the world's other threads stay off it and off its
    # hyperthread siblings. A whole number, 0 or more; the world refuses to start on a CPU the pod may not use. Pick one
    # that takes no network interrupts (/proc/interrupts).
    cpu: ""
    # DOTNET_GCHeapAffinitizeRanges: the CPUs server GC binds its heap threads to, as a CPU list (0-7,9-19,21-23).
    # Unset, it binds one to every CPU, the tick's and its siblings' included: list every CPU but those. A list that
    # holds cpu fails the render (the siblings are not known here).
    gcHeapAffinitizeRanges: ""

replicaCount: 1

# NetworkPolicy for the world pod, off by default (#1052 hardening). On, the game port admits only
# what forwards players to it: with serviceLB, this Service's k3s ServiceLB pods (kube-system, labelled
# svccontroller.k3s.cattle.io/svcname), which masquerade every connection they forward, so the world
# sees their pod-network address (what proxyProtocol.trustedProxies trusts on k3s); and the peers in
# gamePort (podSelector, namespaceSelector, ipBlock), e.g. an in-cluster proxy. The chart refuses to
# enable it with neither, since a rule with no peer would admit every source. Probes come from the
# node: k3s's policy controller admits a pod's own node; add the node's ipBlock to gamePort where
# yours does not. What it does not close: processes on the world's node and hostNetwork pods there
# are always admitted, and arrive from an address the world may trust; a cluster with no policy
# controller enforcing NetworkPolicy ignores it; and ServiceLB pods outside kube-system (k3s
# --servicelb-namespace) do not match serviceLB, so every player is refused (it fails closed).
networkPolicy:
  enabled: false
  serviceLB: false
  gamePort: []

# On SIGTERM (a rollout, node drain or eviction) the world warns its players and waits for them to leave
# for up to drainSeconds, then closes everyone and saves (#768). 0 closes at once. saveMarginSeconds is
# what the close and the saves get after the drain: at least 21, the world's save wait and drain
# backstop. terminationGracePeriodSeconds is drain + margin + 15.
shutdown:
  drainSeconds: 0
  saveMarginSeconds: 60

image:
  repository: ghcr.io/woozchucky/avalon-server/world
  pullPolicy: IfNotPresent
  # Empty means the chart's appVersion, which the release sets to the git tag.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
podAnnotations: {}
podSecurityContext: {}
securityContext: {}

service:
  # LoadBalancer on k3s binds the port on the node (ServiceLB).
  type: ClusterIP
  # With type LoadBalancer: restrict who may connect, e.g. [10.10.1.17/32] for the edge proxy.
  loadBalancerSourceRanges: []
  port: 21001

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 1Gi

# Log levels (Serilog). The world server writes Information and above by default (#819); its per-hit
# combat lines and the networking layer's per-packet lines are Debug. Empty keeps the default.
# One of Verbose, Debug, Information, Warning, Error, Fatal.
logging:
  minimumLevel: ""
  # Per logging category, e.g. {Avalon.World.Entities.CharacterEntity: Debug}.
  overrides: {}

# OpenTelemetry export (OTLP gRPC), e.g. http://otel-collector:4317.
# Empty: nothing is exported.
otel:
  endpoint: ""
  # Defaults to the release's full name.
  serviceName: ""
  # Extra resource attributes, e.g. {deployment.environment: production}.
  # avalon.world.id is always set, from server.game.worldId (a value set here is ignored).
  resourceAttributes: {}
  # How often metrics are exported, in milliseconds (OTEL_METRIC_EXPORT_INTERVAL), a positive
  # integer. Empty: the SDK default, 60000. A load-test world sets 10000 so a load-test step
  # gets 10 s samples (docs/load-testing.md).
  metricExportIntervalMs: ""
