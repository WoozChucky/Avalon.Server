{{- /*
Every secret the world server reads. Skipped when existingSecret names a Secret you manage, which
must hold the same keys. With existingSecret, inline secret values are refused rather than ignored.
*/}}
{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "avalon-server.secretName" . }}
  labels:
    {{- include "avalon-server.labels" . | nindent 4 }}
type: Opaque
stringData:
  database-auth-connection-string: {{ required "server.database.auth.connectionString is required unless existingSecret is set" .Values.server.database.auth.connectionString | quote }}
  database-characters-connection-string: {{ required "server.database.characters.connectionString is required unless existingSecret is set" .Values.server.database.characters.connectionString | quote }}
  database-world-connection-string: {{ required "server.database.world.connectionString is required unless existingSecret is set" .Values.server.database.world.connectionString | quote }}
  cache-password: {{ .Values.server.cache.password | default "" | quote }}
{{- else }}
{{- $given := list }}
{{- if .Values.server.database.auth.connectionString }}{{ $given = append $given "server.database.auth.connectionString" }}{{ end }}
{{- if .Values.server.database.characters.connectionString }}{{ $given = append $given "server.database.characters.connectionString" }}{{ end }}
{{- if .Values.server.database.world.connectionString }}{{ $given = append $given "server.database.world.connectionString" }}{{ end }}
{{- if .Values.server.cache.password }}{{ $given = append $given "server.cache.password" }}{{ end }}
{{- if $given }}
{{- fail (printf "existingSecret is set to %q, so the chart reads every secret from it and would ignore %s. Put those values in the Secret and unset them here, or unset existingSecret." .Values.existingSecret (join ", " $given)) }}
{{- end }}
{{- end }}
