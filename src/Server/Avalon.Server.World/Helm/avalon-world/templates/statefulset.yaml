apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "avalon-server.fullname" . }}
  labels:
    {{- include "avalon-server.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  serviceName: {{ include "avalon-server.fullname" . }}
  selector:
    matchLabels:
      {{- include "avalon-server.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- if not .Values.existingSecret }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "avalon-server.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: DOTNET_ENVIRONMENT
              value: {{ .Values.environment | quote }}
            - name: Hosting__Host
              value: {{ .Values.server.hosting.host | quote }}
            - name: Hosting__Port
              value: {{ .Values.service.port | quote }}
            - name: Hosting__ProxyProtocol__Enabled
              value: {{ .Values.server.proxyProtocol.enabled | quote }}
            - name: Hosting__ProxyProtocol__HeaderTimeoutSeconds
              value: {{ .Values.server.proxyProtocol.headerTimeoutSeconds | quote }}
            {{- range $i, $network := .Values.server.proxyProtocol.trustedProxies }}
            - name: Hosting__ProxyProtocol__TrustedProxies__{{ $i }}
              value: {{ $network | quote }}
            {{- end }}
            - name: Cache__Host
              value: {{ required "server.cache.host is required: host:port of Redis" .Values.server.cache.host | quote }}
            - name: Cache__Password
              valueFrom:
                secretKeyRef:
                  name: {{ include "avalon-server.secretName" . }}
                  key: cache-password
            - name: Database__Auth__ConnectionString
              valueFrom:
                secretKeyRef:
                  name: {{ include "avalon-server.secretName" . }}
                  key: database-auth-connection-string
            - name: Database__Characters__ConnectionString
              valueFrom:
                secretKeyRef:
                  name: {{ include "avalon-server.secretName" . }}
                  key: database-characters-connection-string
            - name: Database__World__ConnectionString
              valueFrom:
                secretKeyRef:
                  name: {{ include "avalon-server.secretName" . }}
                  key: database-world-connection-string
            - name: Game__WorldId
              value: {{ .Values.server.game.worldId | quote }}
            - name: Game__PlayerRadius
              value: {{ .Values.server.game.playerRadius | quote }}
            - name: Game__MaxCharactersPerAccount
              value: {{ .Values.server.game.maxCharactersPerAccount | quote }}
            - name: DOTNET_HOSTBUILDER__RELOADCONFIGONCHANGE
              value: "false"
            {{- with .Values.otel.endpoint }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ . | quote }}
            - name: OTEL_SERVICE_NAME
              value: {{ $.Values.otel.serviceName | default (include "avalon-server.fullname" $) | quote }}
            {{- $attrs := list (printf "avalon.world.id=%v" $.Values.server.game.worldId) }}
            {{- range $key, $value := $.Values.otel.resourceAttributes }}
            {{- $attrs = append $attrs (printf "%s=%v" $key $value) }}
            {{- end }}
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: {{ join "," $attrs | quote }}
            {{- end }}
          ports:
            - name: server-tcp
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          startupProbe:
            # Migrations run before the port opens; allow them up to 5 minutes on first install.
            tcpSocket:
              port: server-tcp
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: server-tcp
            initialDelaySeconds: 20
            periodSeconds: 20
          readinessProbe:
            tcpSocket:
              port: server-tcp
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
