# Promote the newest dev build to PTR without rebuilding it.
name: Nightly PTR promotion
on:
  schedule: [{ cron: '0 2 * * *' }]
  workflow_dispatch: {}
concurrency: { group: server-nightly, cancel-in-progress: false }
jobs:
  promote:
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    outputs:
      promote: ${{ steps.pick.outputs.promote }}
      version: ${{ steps.pick.outputs.nightly }}
      commit: ${{ steps.pick.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
      - uses: imjasonh/setup-crane@v0.7
      - uses: azure/setup-helm@v5
      - name: Log in
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | crane auth login ghcr.io -u "${{ github.actor }}" --password-stdin
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Pick the build
        id: pick
        run: |
          set -euo pipefail
          tags="$(crane ls ghcr.io/woozchucky/charts/avalon-world)"
          dev="$(tools/release/channel-version.sh newest-dev $tags)"
          if [[ -z "$dev" ]]; then echo "no dev build yet"; echo "promote=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          nightly="$(tools/release/channel-version.sh nightly-of "$dev")"
          if grep -qx "$nightly" <<< "$tags"; then echo "PTR already has $dev ($nightly)"; echo "promote=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          commit="$(crane config "ghcr.io/woozchucky/avalon-server/world:$dev" | jq -r '.config.Labels["org.opencontainers.image.revision"]')"
          { echo "promote=true"; echo "dev=$dev"; echo "nightly=$nightly"; echo "commit=$commit"; } >> "$GITHUB_OUTPUT"
          echo "promoting $dev -> $nightly ($commit)"
      - name: Tag the images
        if: steps.pick.outputs.promote == 'true'
        run: |
          set -euo pipefail
          for c in world auth api; do
            crane tag "ghcr.io/woozchucky/avalon-server/$c:${{ steps.pick.outputs.dev }}" "${{ steps.pick.outputs.nightly }}"
          done
      # Charts are pushed after all images, with avalon-world last. Its tag is the skip and Flux marker.
      - name: Repackage and push the charts
        if: steps.pick.outputs.promote == 'true'
        env: { DEV: "${{ steps.pick.outputs.dev }}", NIGHTLY: "${{ steps.pick.outputs.nightly }}" }
        run: |
          set -euo pipefail
          mkdir -p work out
          for chart in avalon-api avalon-auth avalon-world; do
            helm pull "oci://ghcr.io/woozchucky/charts/$chart" --version "$DEV" --untar -d "work/$chart"
            helm package "work/$chart/$chart" --version "$NIGHTLY" --app-version "$NIGHTLY" -d out
            helm push "out/$chart-$NIGHTLY.tgz" oci://ghcr.io/woozchucky/charts
          done

  changelog:
    needs: promote
    if: needs.promote.outputs.promote == 'true'
    runs-on: ubuntu-latest
    permissions: { contents: read, pull-requests: read }
    steps:
      - uses: actions/setup-python@v7
        with: { python-version: '3.14' }
      - name: Changelog entry
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DIST_S3_ENDPOINT: https://dist.avalon.nunolevezinho.xyz
          DIST_S3_ACCESS_KEY: ${{ secrets.DIST_S3_ACCESS_KEY }}
          DIST_S3_SECRET_KEY: ${{ secrets.DIST_S3_SECRET_KEY }}
        run: |
          set -euo pipefail
          python -m pip install -q "avalon-release-notes[s3] @ git+https://github.com/WoozChucky/avalon-release-notes@v0.3.0"
          python -m avalon_release_notes publish --repo "$GITHUB_REPOSITORY" --product server --channel ptr \
            --version "${{ needs.promote.outputs.version }}" --commit "${{ needs.promote.outputs.commit }}" \
            --published-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --public
