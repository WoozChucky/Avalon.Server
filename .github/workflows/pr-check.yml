name: PR check
# Conventional Commits title and a player note; the rules live in WoozChucky/avalon-release-notes.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
permissions: {}
jobs:
  pr-check:
    name: Title and player note
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: WoozChucky/avalon-release-notes/pr-check@7bdce851d465eea4b1cd760cff3c72b3e2fbedbc # v0.4.1
        with:
          title: ${{ github.event.pull_request.title }}
          body: ${{ github.event.pull_request.body }}
          author: ${{ github.event.pull_request.user.login }}
