name: .NET Release Pipeline

on:
  push:
    tags:
      - 'v*'

jobs:
  # Live gets only what PTR tested (#686): the tag must be on the commit of the newest PTR (nightly) build.
  # An annotated tag whose message contains [hotfix] skips the check, with a warning.
  ptr-gate:
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: read }
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: imjasonh/setup-crane@v0.7
      - name: The tag is what PTR runs
        env: { TAG: "${{ github.ref_name }}", TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          set -euo pipefail
          # checkout leaves the tag lightweight; fetch it again to read an annotated tag's message.
          git fetch -q -f origin "refs/tags/$TAG:refs/tags/$TAG"
          commit="$(git rev-parse "$TAG^{commit}")"
          if git tag -l --format='%(contents)' "$TAG" | grep -qF '[hotfix]'; then
            echo "::warning::$TAG is marked [hotfix]: releasing $commit without checking it against PTR"
            exit 0
          fi
          echo "$TOKEN" | crane auth login ghcr.io -u "${{ github.actor }}" --password-stdin
          nightly="$(tools/release/channel-version.sh newest-nightly $(crane ls ghcr.io/woozchucky/charts/avalon-world))"
          if [[ -z "$nightly" ]]; then
            echo "::error::PTR has no build yet. Tag a commit PTR runs, or mark the tag [hotfix]."
            exit 1
          fi
          ptr="$(crane config "ghcr.io/woozchucky/avalon-server/world:$nightly" | jq -r '.config.Labels["org.opencontainers.image.revision"]')"
          if [[ "$ptr" != "$commit" ]]; then
            echo "::error::$TAG is on $commit, but PTR runs $nightly from $ptr. Delete the tag and tag $ptr, or tag again with an annotated message containing [hotfix]."
            exit 1
          fi
          echo "$TAG is what PTR runs ($nightly)"

  release:
    needs: ptr-gate

    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub release
      packages: write   # push images and charts to ghcr

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.*.props', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - name: Restore dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build -c Release --no-restore
      - name: Test
        run: dotnet test -c Release --no-build --logger trx --results-directory TestResults
      # Keeps each test's name, message and stack when the run fails, so a rare flaky failure is not lost (#572).
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/**/*.trx
          retention-days: 14
      - name: Version
        id: version
        run: |
          v="${GITHUB_REF_NAME#v}"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "minor=${v%.*}" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/publish-server
        with:
          version: ${{ steps.version.outputs.version }}
          extra-tags: |
            ${{ steps.version.outputs.minor }}
            latest
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true

  # The public changelog's entry for this release: the player notes of the pull requests merged since the
  # previous entry (WoozChucky/avalon-release-notes), written to avalon-dist once the release is out.
  # Its own job, so a failure is re-run alone ("Re-run failed jobs"), not with the images and charts.
  changelog:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Changelog entry
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DIST_S3_ENDPOINT: https://dist.avalon.nunolevezinho.xyz
          DIST_S3_ACCESS_KEY: ${{ secrets.DIST_S3_ACCESS_KEY }}
          DIST_S3_SECRET_KEY: ${{ secrets.DIST_S3_SECRET_KEY }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python -m pip install -q "avalon-release-notes[s3] @ git+https://github.com/WoozChucky/avalon-release-notes@v0.3.0"
          python -m avalon_release_notes publish --repo "$GITHUB_REPOSITORY" --product server --version "${TAG#v}" \
            --commit "$GITHUB_SHA" --published-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --release-url "https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" --public

  # Dev builds are versioned from the newest tag, so build main again now: dev reads X.Y.(Z+1)-dev.N straight
  # away instead of the previous version's number on the same code (#686).
  dev-build:
    needs: release
    runs-on: ubuntu-latest
    permissions: { actions: write }
    steps:
      - run: gh workflow run dotnet-ci.yml -R "$GITHUB_REPOSITORY" -f ref=main
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
