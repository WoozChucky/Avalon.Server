name: .NET Release Pipeline

on:
  push:
    tags:
      - 'v*'
  # "Run workflow": release a PTR build now. Tags the build's commit itself, then releases it.
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, X.Y.Z (the tag vX.Y.Z must not exist yet)
        required: true
      build:
        description: PTR build to release, X.Y.Z-nightly.N; empty for what PTR runs now
        required: false
        default: ''

jobs:
  # Live gets only what PTR tested (#686): the release's commit must be one a PTR (nightly) build was made
  # from, among the nightly images the registry still keeps (the last 14 days, and always the newest ten).
  # A pushed annotated tag whose message contains [hotfix] skips the check, with a warning.
  resolve:
    runs-on: ubuntu-latest
    permissions: { contents: write, packages: read }   # contents: write to push the tag a manual run creates
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      commit: ${{ steps.pick.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: imjasonh/setup-crane@v0.7
      - name: Pick the release
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          VERSION: ${{ inputs.version }}
          BUILD: ${{ inputs.build }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$TOKEN" | crane auth login ghcr.io -u "${{ github.actor }}" --password-stdin
          tags="$(crane ls ghcr.io/woozchucky/charts/avalon-world)"
          revision() { crane config "ghcr.io/woozchucky/avalon-server/world:$1" | jq -r '.config.Labels["org.opencontainers.image.revision"]'; }

          if [[ "$EVENT" == workflow_dispatch ]]; then
            [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::version must be X.Y.Z, got '$VERSION'"; exit 1; }
            tag="v$VERSION"
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
              echo "::error::$tag already exists"; exit 1
            fi
            build="${BUILD:-$(tools/release/channel-version.sh newest-nightly $tags)}"
            [[ "$build" =~ ^[0-9]+\.[0-9]+\.[0-9]+-nightly\.[0-9]+$ ]] || { echo "::error::no PTR build to release ('$build')"; exit 1; }
            grep -qx "$build" <<< "$tags" || { echo "::error::$build is not a PTR build in the registry"; exit 1; }
            commit="$(revision "$build")"
            git tag "$tag" "$commit"
            git push origin "$tag"   # pushed with GITHUB_TOKEN, so it starts no second release run
            echo "releasing PTR build $build ($commit) as $tag"
          else
            tag="$REF_NAME"
            # checkout leaves the tag lightweight; fetch it again to read an annotated tag's message.
            git fetch -q -f origin "refs/tags/$tag:refs/tags/$tag"
            commit="$(git rev-parse "$tag^{commit}")"
            if git tag -l --format='%(contents)' "$tag" | grep -qF '[hotfix]'; then
              echo "::warning::$tag is marked [hotfix]: releasing $commit without checking it against PTR"
            else
              tested=""
              for n in $(tools/release/channel-version.sh nightlies $tags); do
                if [[ "$(revision "$n")" == "$commit" ]]; then tested="$n"; break; fi
              done
              if [[ -z "$tested" ]]; then
                newest="$(tools/release/channel-version.sh newest-nightly $tags)"
                echo "::error::$tag is on $commit, which no PTR build in the registry was made from. PTR runs ${newest:-nothing yet}${newest:+ from $(revision "$newest")}. Delete the tag and tag a PTR build's commit (or use Run workflow), or tag again with an annotated message containing [hotfix]."
                exit 1
              fi
              echo "$tag is PTR build $tested"
            fi
          fi
          { echo "tag=$tag"; echo "commit=$commit"; } >> "$GITHUB_OUTPUT"

  release:
    needs: resolve

    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub release
      packages: write   # push images and charts to ghcr

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          ref: ${{ needs.resolve.outputs.commit }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.*.props', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - name: Restore dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build -c Release --no-restore
      - name: Test
        run: dotnet test -c Release --no-build --logger trx --results-directory TestResults
      # Keeps each test's name, message and stack when the run fails, so a rare flaky failure is not lost (#572).
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/**/*.trx
          retention-days: 14
      - name: Version
        id: version
        env: { TAG: "${{ needs.resolve.outputs.tag }}" }
        run: |
          v="${TAG#v}"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "minor=${v%.*}" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/publish-server
        with:
          version: ${{ steps.version.outputs.version }}
          extra-tags: |
            ${{ steps.version.outputs.minor }}
            latest
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          generate_release_notes: true

  # The public changelog's entry for this release: the player notes of the pull requests merged since the
  # previous entry (WoozChucky/avalon-release-notes), written to avalon-dist once the release is out.
  # Its own job, so a failure is re-run alone ("Re-run failed jobs"), not with the images and charts.
  changelog:
    needs: [resolve, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Changelog entry
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DIST_S3_ENDPOINT: https://dist.avalon.nunolevezinho.xyz
          DIST_S3_ACCESS_KEY: ${{ secrets.DIST_S3_ACCESS_KEY }}
          DIST_S3_SECRET_KEY: ${{ secrets.DIST_S3_SECRET_KEY }}
          TAG: ${{ needs.resolve.outputs.tag }}
          COMMIT: ${{ needs.resolve.outputs.commit }}
        run: |
          set -euo pipefail
          python -m pip install -q "avalon-release-notes[s3] @ git+https://github.com/WoozChucky/avalon-release-notes@v0.3.0"
          python -m avalon_release_notes publish --repo "$GITHUB_REPOSITORY" --product server --version "${TAG#v}" \
            --commit "$COMMIT" --published-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --release-url "https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" --public

  # Dev builds are versioned from the newest tag, so build main again now: dev reads X.Y.(Z+1)-dev.N straight
  # away instead of the previous version's number on the same code (#686).
  dev-build:
    needs: release
    runs-on: ubuntu-latest
    permissions: { actions: write }
    steps:
      - run: gh workflow run dotnet-ci.yml -R "$GITHUB_REPOSITORY" -f ref=main
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
