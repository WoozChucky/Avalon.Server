name: .NET PR Pipeline

on:
  pull_request:
    types: [ opened, synchronize, reopened ]

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # Pull Repos
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x
      - name: Restore dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore
      - name: Test
        run: dotnet test --no-build
      - name: Publish World Server
        run: dotnet publish src/Server/Avalon.Server.World/Avalon.Server.World.csproj -c Release --no-restore -o src/Server/Avalon.Server.World/out
      - name: Publish Auth Server
        run: dotnet publish src/Server/Avalon.Server.Auth/Avalon.Server.Auth.csproj -c Release --no-restore -o src/Server/Avalon.Server.Auth/out
      - name: Publish Api
        run: dotnet publish src/Server/Avalon.Api/Avalon.Api.csproj -c Release --no-restore -o src/Server/Avalon.Api/out

  charts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4
      - name: Chart tests
        run: |
          set -euo pipefail
          for t in src/Server/*/Helm/*/ci/test.sh; do
            echo "::group::$t"
            bash "$t"
            echo "::endgroup::"
          done
