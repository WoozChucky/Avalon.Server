name: .NET PR Pipeline

on:
  pull_request:
    types: [ opened, synchronize, reopened ]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:

    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      # Pull Repos
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Cache NuGet packages
        # Not on the k3s runners: their NuGet folder persists (/cache/nuget, homelab docs/ci-runners.md), and this cache is 1.9 GB to download.
        if: vars.CI_RUNNER == ''
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.*.props', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - name: Restore dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build -c Release --no-restore
      # The build enforces the code standard (docs/coding-standard.md); whitespace, byte-order marks and final
      # newlines are only checked here.
      - name: Check formatting
        run: dotnet format whitespace --verify-no-changes --no-restore
      - name: Test
        # A hung test fails after 5 minutes and names itself (blame Sequence file in TestResults), not hours later.
        timeout-minutes: 20
        run: dotnet test -c Release --no-build --logger trx --results-directory TestResults --blame-hang-timeout 5m --blame-hang-dump-type none
      - name: Test channel versions
        run: bash tools/release/test.sh
      - name: Test registry cleanup selection
        run: python -m unittest discover -s tools/release -p 'test_*.py'
      # Keeps each test's name, message and stack when the run fails, so a rare flaky failure is not lost (#572).
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/**/*.trx
          retention-days: 14
      # ReadyToRun off: this check only proves publishing works, and native compilation
      # costs most of the step. With it on, publish infers the runner's runtime identifier
      # and needs a RID-specific build, so --no-build fails. The release workflow keeps it.
      - name: Publish World Server
        run: dotnet publish src/Server/Avalon.Server.World/Avalon.Server.World.csproj -c Release --no-build -p:PublishReadyToRun=false -o src/Server/Avalon.Server.World/out
      - name: Publish Api
        run: dotnet publish src/Server/Avalon.Api/Avalon.Api.csproj -c Release --no-build -o src/Server/Avalon.Api/out
      - name: Publish Balance Service
        run: dotnet publish src/Server/Avalon.Balance.Service/Avalon.Balance.Service.csproj -c Release --no-restore -p:SourceRevisionId="$(git rev-parse HEAD)" -o src/Server/Avalon.Balance.Service/out

      - name: Publish Crashes Worker
        run: |
          dotnet restore src/Server/Avalon.Crashes.Worker/Avalon.Crashes.Worker.csproj -r linux-x64
          dotnet publish src/Server/Avalon.Crashes.Worker/Avalon.Crashes.Worker.csproj -c Release -r linux-x64 --self-contained false --no-restore -p:UseAppHost=false -o src/Server/Avalon.Crashes.Worker/out

  charts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - name: Install chart test dependencies
        run: python -m pip install PyYAML==6.0.2
      - name: Chart tests
        run: |
          set -euo pipefail
          for t in src/Server/*/Helm/*/ci/test.sh; do
            echo "::group::$t"
            bash "$t"
            echo "::endgroup::"
          done
