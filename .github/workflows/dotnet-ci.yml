name: .NET CI and dev builds

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, branch or tag to build for dev
        default: main

# A dev build (#1018): build and publish run side by side, the tests in build, the four servers and their images in
# publish. The charts are what Flux deploys, and charts waits for both: a run whose tests fail pushes no chart, only
# dev-tagged images nothing names, which the registry cleanup removes.
jobs:
  build:

    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.commit.outputs.commit }}

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          ref: ${{ inputs.ref || github.sha }}
      - name: Commit
        id: commit
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Cache NuGet packages
        # Not on the k3s runners: their NuGet folder persists (/cache/nuget, homelab docs/ci-runners.md), and this cache is 1.9 GB to download.
        if: vars.CI_RUNNER == ''
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.*.props', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - name: Restore dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build -c Release --no-restore
      - name: Test
        # A hung test fails after 5 minutes and names itself (blame Sequence file in TestResults), not hours later.
        timeout-minutes: 20
        run: dotnet test -c Release --no-build --logger trx --results-directory TestResults --blame-hang-timeout 5m --blame-hang-dump-type none
      - name: Test channel versions
        run: bash tools/release/test.sh
      - name: Test registry cleanup selection
        run: python -m unittest discover -s tools/release -p 'test_*.py'
      # Keeps each test's name, message and stack when the run fails, so a rare flaky failure is not lost (#572).
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/**/*.trx
          retention-days: 14

  # Builds only the four servers, each project once (not the solution build's tests and tools), and pushes their
  # images under this run's dev version. No chart names them yet, so nothing deploys them.
  publish:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 45
    permissions: { contents: read, packages: write }
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with: { submodules: recursive, fetch-depth: 0, ref: "${{ inputs.ref || github.sha }}" }
      - uses: actions/setup-dotnet@v6
        with: { dotnet-version: 10.0.x }
      # build's cache, read only: build saves it, so two jobs never race to save the same key.
      - if: vars.CI_RUNNER == ''   # see build's NuGet cache step
        uses: actions/cache/restore@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.*.props', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - name: Restore the servers
        run: |
          set -euo pipefail
          for p in src/Server/Avalon.Server.World/Avalon.Server.World.csproj src/Server/Avalon.Server.Auth/Avalon.Server.Auth.csproj \
                   src/Server/Avalon.Api/Avalon.Api.csproj src/Server/Avalon.Balance.Service/Avalon.Balance.Service.csproj; do
            dotnet restore "$p"
          done
      - name: Version
        id: version
        run: |
          set -euo pipefail
          tag="$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1)"
          echo "version=$(tools/release/channel-version.sh dev-version "$tag" "$GITHUB_RUN_NUMBER")" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/publish-server
        with: { version: "${{ steps.version.outputs.version }}", token: "${{ secrets.GITHUB_TOKEN }}" }

  # The deploy: only once the tests passed and every image is in the registry. One run at a time (server-dev), with
  # avalon-world last, as before #1018.
  charts:
    needs: [build, publish]
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    concurrency: { group: server-dev, cancel-in-progress: false }
    permissions: { contents: read, packages: write }
    steps:
      # Each job checked its ref out on its own; a manual run's branch can move in between. Deploy only the commit
      # the tests ran on.
      - name: Tested what was published
        env: { TESTED: "${{ needs.build.outputs.commit }}", PUBLISHED: "${{ needs.publish.outputs.commit }}" }
        run: |
          if [[ -z "$TESTED" || "$TESTED" != "$PUBLISHED" ]]; then
            echo "::error::the tests ran on '$TESTED' but the images were built from '$PUBLISHED'; run the build again"
            exit 1
          fi
      - uses: actions/checkout@v7
        with: { ref: "${{ needs.publish.outputs.commit }}" }
      - uses: ./.github/actions/push-charts
        with: { version: "${{ needs.publish.outputs.version }}", token: "${{ secrets.GITHUB_TOKEN }}" }

  changelog:
    needs: [publish, charts]
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    permissions: { contents: read, pull-requests: read }
    steps:
      - uses: actions/setup-python@v7
        with: { python-version: '3.15' }
      - name: Changelog entry
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DIST_S3_ENDPOINT: https://dist.avalon.nunolevezinho.xyz
          DIST_S3_ACCESS_KEY: ${{ secrets.DIST_S3_ACCESS_KEY }}
          DIST_S3_SECRET_KEY: ${{ secrets.DIST_S3_SECRET_KEY }}
        run: |
          set -euo pipefail
          python -m pip install -q "avalon-release-notes[s3] @ git+https://github.com/WoozChucky/avalon-release-notes@v0.4.0"
          python -m avalon_release_notes publish --repo "$GITHUB_REPOSITORY" --product server --channel dev \
            --version "${{ needs.publish.outputs.version }}" --commit "${{ needs.publish.outputs.commit }}" \
            --published-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --public
